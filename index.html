        )}

        <div className="grid2">
          <Bidang label="Tanggal">
            <input type="date" value={tanggal} onChange={e=>setTanggal(e.target.value)}/>
            <div className="pils" style={{marginTop:6}}>
              <button className={"pil"+(tanggal===hariIni()?" aktif":"")} onClick={()=>geserTgl(0)}>Hari ini</button>
              <button className="pil" onClick={()=>geserTgl(-1)}>Kemarin</button>
            </div>
          </Bidang>
          <Bidang label={jenis==="pindah"?"Dari akun":"Metode"}>
            <select value={metode} onChange={e=>setMetode(e.target.value)}>
              {DAFTAR_AKUN.map(m=><option key={m.id} value={m.id}>{m.ikon} {m.nama}</option>)}
            </select>
            {jenis==="pindah" && (
              <div style={{marginTop:6}}>
                <span className="label">Ke akun</span>
                <select value={tujuan} onChange={e=>setTujuan(e.target.value)}>
                  {DAFTAR_AKUN.map(m=><option key={m.id} value={m.id}>{m.ikon} {m.nama}</option>)}
                </select>
              </div>
            )}
          </Bidang>
        </div>

        <Bidang label="Untuk apa" petunjuk="Tulis sejelas mungkin, nanti kebaca di laporan.">
          <input value={catatan} onChange={e=>setCatatan(e.target.value)} placeholder="Contoh: makan siang di warteg depan kantor"/>
        </Bidang>

        {jenis!=="pindah" && (
          <label className="baris" style={{gap:9,background:"var(--lembut)",padding:"10px 12px",borderRadius:12,cursor:"pointer"}}>
            <input type="checkbox" checked={pintas} onChange={e=>setPintas(e.target.checked)}
              style={{width:18,height:18,padding:0,flex:"0 0 18px",accentColor:"#047857"}}/>
            <span style={{fontSize:12.5}}>Jadikan pintasan catat kilat
              <span className="samar" style={{display:"block"}}>Muncul di beranda, sekali ketuk langsung tercatat</span></span>
          </label>
        )}

        {galat && <div style={{color:"var(--merah)",fontSize:12.5}}>{galat}</div>}

        <div className="baris" style={{gap:8}}>
          {tx && tx.id && (
            <button className="tbl" style={{color:"var(--merah)"}} onClick={()=>{hapusTx(tx.id); tutup();}}>🗑 Hapus</button>
          )}
          <button className="tbl tbl-utama tbl-penuh" onClick={kirim}>Simpan</button>
        </div>
      </div>
    </Lembar>
  );
}

/* ================= ALOKASI ================= */
function Alokasi({db, aksi}){
  const [mk,setMk] = useState(bulanIni());
  const rencana = rencanaBulan(db,mk);
  const pakai = pakaiPos(db,mk);
  const R = ringkasBulan(db,mk);
  const [pemasukan,setPemasukan] = useState(nf.format(rencana.pemasukan||0));
  const [nilai,setNilai] = useState({...rencana.pos});

  useEffect(()=>{
    const r = rencanaBulan(db,mk);
    setPemasukan(nf.format(r.pemasukan||0));
    setNilai({...r.pos});
  },[mk, db.rencana]);

  const dasar = angka(pemasukan);
  const totalBagi = db.pos.reduce((s,p)=>s+(nilai[p.id]||0),0);
  const selisih = dasar - totalBagi;
  const berubah = JSON.stringify(nilai)!==JSON.stringify(rencana.pos) || dasar!==rencana.pemasukan;

  const pakaiTemplat = t => {
    const baru = {};
    db.pos.forEach(p=> baru[p.id] = Math.round(dasar*(t.bagi[p.id]??0)/100));
    setNilai(baru);
  };
  const samakan = () => {
    const baru = {};
    db.pos.forEach(p=> baru[p.id] = Math.round(dasar*p.persen/100));
    setNilai(baru);
  };

  const dataDonat = db.pos.map(p=>({label:p.nama, nilai:nilai[p.id]||0, warna:p.warna})).filter(d=>d.nilai>0);
  const dataBanding = db.pos.map(p=>({label:p.nama, warna:p.warna, rencana:nilai[p.id]||0, nyata:pakai[p.id]||0}));
  const maksBanding = Math.max(1, ...dataBanding.flatMap(d=>[d.rencana,d.nyata]));

  return (
    <div className="blok">
      <Kartu>
        <div className="antara">
          <button className="tbl" onClick={()=>setMk(geserBulan(mk,-1))}>‹</button>
          <div style={{textAlign:"center"}}>
            <div className="judul">{namaBulan(mk)}</div>
            <div className="samar">Rencana pembagian</div>
          </div>
          <button className="tbl" onClick={()=>setMk(geserBulan(mk,1))} disabled={mk>=bulanIni()}
            style={{opacity: mk>=bulanIni()?.4:1}}>›</button>
        </div>
      </Kartu>

      <Kartu judul="Uang yang dibagi">
        <InputNominal nilai={pemasukan} set={setPemasukan}/>
        <div className="samar" style={{marginTop:6}}>
          Pemasukan nyata bulan ini {rp(R.masuk)}.
          {R.masuk>0 && R.masuk!==dasar && (
            <button className="naik" style={{marginLeft:6,textDecoration:"underline"}}
              onClick={()=>setPemasukan(nf.format(R.masuk))}>pakai angka ini</button>
          )}
        </div>
        <div className="pils" style={{marginTop:10}}>
          {TEMPLAT.map(t=>(
            <button key={t.nama} className="pil" onClick={()=>pakaiTemplat(t)} title={t.ket}>{t.nama}</button>
          ))}
          <button className="pil" onClick={samakan}>Pakai persen pos</button>
        </div>
      </Kartu>

      <Kartu judul="Dibagi ke mana">
        <div style={{display:"grid",gap:12}}>
          {db.pos.map(p=>{
            const n = nilai[p.id]||0;
            const pct = dasar? n/dasar*100 : 0;
            return (
              <div key={p.id}>
                <div className="antara" style={{marginBottom:5}}>
                  <span className="baris" style={{gap:7,fontSize:13.5,fontWeight:550}}>
                    <i style={{width:10,height:10,borderRadius:3,background:p.warna,display:"block"}}/>
                    {p.ikon} {p.nama}
                  </span>
                  <span className="samar num">{Math.round(pct)}%</span>
                </div>
                <div className="baris" style={{gap:8}}>
                  <input inputMode="numeric" value={n? nf.format(n):""} placeholder="0"
                    onChange={e=>setNilai({...nilai, [p.id]:angka(e.target.value)})}
                    className="num" style={{fontSize:14}}/>
                  <button className="pil" onClick={()=>setNilai({...nilai,[p.id]:Math.round(dasar*p.persen/100)})}>
                    {p.persen}%
                  </button>
                </div>
              </div>
            );
          })}
        </div>

        <div className={"peringatan "+(Math.abs(selisih)<1000?"p-info":selisih<0?"p-bahaya":"p-waspada")} style={{marginTop:14}}>
          <span>{Math.abs(selisih)<1000?"✅":selisih<0?"🚨":"⚠️"}</span>
          <div>
            {Math.abs(selisih)<1000
              ? <>Pas. Semua {rp(dasar)} sudah ada tempatnya.</>
              : selisih<0
                ? <>Pembagian lebih {rp(-selisih)} dari uang yang ada. Kurangi dulu, kalau tidak pasti jebol.</>
                : <>Masih ada {rp(selisih)} yang belum ditentukan. Uang tanpa tujuan paling gampang habis — masukkan ke Tabungan atau Dana Darurat.</>}
          </div>
        </div>

        {berubah && (
          <button className="tbl tbl-utama tbl-penuh" style={{marginTop:12}}
            onClick={()=>aksi.simpanRencana(mk,{pemasukan:dasar, pos:nilai})}>Simpan pembagian</button>
        )}
      </Kartu>

      {dataDonat.length>0 && (
        <Kartu judul="Bagan pembagian">
          <BatangTumpuk data={dataDonat} tinggi={30}/>
          <div style={{display:"flex",flexWrap:"wrap",gap:16,marginTop:16,alignItems:"center",justifyContent:"center"}}>
            <Donat data={dataDonat} tengah={rpk(dasar)} bawah="dibagi"/>
            <div style={{flex:"1 1 220px",display:"grid",gap:7}}>
              {dataDonat.map(d=>(
                <div key={d.label} className="baris" style={{fontSize:12.5}}>
                  <i style={{width:10,height:10,borderRadius:3,background:d.warna,display:"block"}}/>
                  <span className="isi potong">{d.label}</span>
                  <span className="samar">{Math.round(d.nilai/(dasar||1)*100)}%</span>
                  <span className="num" style={{width:92,textAlign:"right"}}>{rp(d.nilai)}</span>
                </div>
              ))}
            </div>
          </div>
        </Kartu>
      )}

      <Kartu judul="Rencana vs kenyataan">
        <div style={{display:"grid",gap:13}}>
          {dataBanding.map(d=>(
            <div key={d.label}>
              <div className="antara" style={{fontSize:12.5,marginBottom:5}}>
                <span>{d.label}</span>
                <span className="num samar">{rpk(d.nyata)} dari {rpk(d.rencana)}</span>
              </div>
              <div style={{display:"grid",gap:3}}>
                <div style={{height:9,background:"var(--lembut)",borderRadius:999,overflow:"hidden"}}>
                  <i style={{display:"block",height:"100%",width:(d.rencana/maksBanding*100)+"%",background:d.warna,opacity:.35,borderRadius:999}}/>
                </div>
                <div style={{height:9,background:"var(--lembut)",borderRadius:999,overflow:"hidden"}}>
                  <i style={{display:"block",height:"100%",width:(d.nyata/maksBanding*100)+"%",
                    background: d.nyata>d.rencana?"var(--merah)":d.warna, borderRadius:999}}/>
                </div>
              </div>
              <div className="samar" style={{marginTop:3}}>
                {d.nyata<=d.rencana ? `Sisa ${rp(d.rencana-d.nyata)}` : `Lewat ${rp(d.nyata-d.rencana)}`}
              </div>
            </div>
          ))}
        </div>
        <div className="samar" style={{marginTop:10}}>Batang atas yang pudar = rencana. Batang bawah = yang benar-benar terpakai.</div>
      </Kartu>
    </div>
  );
}

/* ================= RIWAYAT ================= */
function Riwayat({db, aksi}){
  const [cari,setCari]       = useState("");
  const [periode,setPeriode] = useState("bulan");
  const [jenis,setJenis]     = useState("semua");
  const [kategori,setKat]    = useState("semua");
  const [metode,setMetode]   = useState("semua");
  const [dari,setDari]       = useState("");
  const [sampai,setSampai]   = useState("");

  const hasil = useMemo(()=>{
    const skrg = new Date();
    const awalMinggu = new Date(skrg); awalMinggu.setDate(skrg.getDate()-skrg.getDay());
    return db.transaksi.filter(t=>{
      if(periode==="hari"   && t.tanggal!==hariIni()) return false;
      if(periode==="minggu" && t.tanggal<iso(awalMinggu)) return false;
      if(periode==="bulan"  && kunciBulan(t.tanggal)!==bulanIni()) return false;
      if(periode==="pilih"){
        if(dari && t.tanggal<dari) return false;
        if(sampai && t.tanggal>sampai) return false;
      }
      if(jenis!=="semua" && t.jenis!==jenis) return false;
      if(kategori!=="semua" && t.kategori!==kategori) return false;
      if(metode!=="semua" && t.metode!==metode && t.metodeTujuan!==metode) return false;
      if(cari){
        const s = cari.toLowerCase();
        const angkaCari = s.replace(/\D/g,"");
        const cocok = (t.catatan||"").toLowerCase().includes(s)
          || kat(t.kategori).nama.toLowerCase().includes(s)
          || (angkaCari && String(t.nominal).includes(angkaCari));
        if(!cocok) return false;
      }
      return true;
    });
  },[db.transaksi,cari,periode,jenis,kategori,metode,dari,sampai]);

  const masuk = hasil.filter(t=>t.jenis==="masuk").reduce((s,t)=>s+t.nominal,0);
  const keluar = hasil.filter(t=>t.jenis==="keluar").reduce((s,t)=>s+t.nominal,0);

  const grup = useMemo(()=>{
    const g = {};
    hasil.forEach(t=> (g[t.tanggal]=g[t.tanggal]||[]).push(t));
    return Object.entries(g).sort((a,b)=> a[0]<b[0]?1:-1);
  },[hasil]);

  return (
    <div className="blok">
      <input value={cari} onChange={e=>setCari(e.target.value)} placeholder="🔍 Cari catatan, kategori, atau nominal"/>

      <div className="pils">
        {[["hari","Hari ini"],["minggu","Minggu ini"],["bulan","Bulan ini"],["semua","Semua"],["pilih","Pilih tanggal"]].map(([id,l])=>(
          <button key={id} className={"pil"+(periode===id?" aktif":"")} onClick={()=>setPeriode(id)}>{l}</button>
        ))}
      </div>

      {periode==="pilih" && (
        <div className="grid2">
          <Bidang label="Dari"><input type="date" value={dari} onChange={e=>setDari(e.target.value)}/></Bidang>
          <Bidang label="Sampai"><input type="date" value={sampai} onChange={e=>setSampai(e.target.value)}/></Bidang>
        </div>
      )}

      <div className="grid3">
        <select value={jenis} onChange={e=>setJenis(e.target.value)} style={{fontSize:12.5,padding:"9px 8px"}}>
          <option value="semua">Semua jenis</option>
          <option value="keluar">Pengeluaran</option>
          <option value="masuk">Pemasukan</option>
          <option value="pindah">Pindah dana</option>
        </select>
        <select value={kategori} onChange={e=>setKat(e.target.value)} style={{fontSize:12.5,padding:"9px 8px"}}>
          <option value="semua">Semua kategori</option>
          {SEMUA_KAT.map(k=><option key={k.id+k.nama} value={k.id}>{k.nama}</option>)}
        </select>
        <select value={metode} onChange={e=>setMetode(e.target.value)} style={{fontSize:12.5,padding:"9px 8px"}}>
          <option value="semua">Semua metode</option>
          {DAFTAR_AKUN.map(m=><option key={m.id} value={m.id}>{m.nama}</option>)}
        </select>
      </div>

      <div className="grid3">
        <Kartu pad={12}><div className="samar">Masuk</div><div className="num naik" style={{fontWeight:650}}>{rpk(masuk)}</div></Kartu>
        <Kartu pad={12}><div className="samar">Keluar</div><div className="num turun" style={{fontWeight:650}}>{rpk(keluar)}</div></Kartu>
        <Kartu pad={12}><div className="samar">Selisih</div><div className="num" style={{fontWeight:650}}>{rpk(masuk-keluar)}</div></Kartu>
      </div>

      {grup.length===0
        ? <Kosong ikon="🔍" teks="Tidak ada transaksi yang cocok dengan saringan ini."
            aksi={<button className="tbl tbl-utama" onClick={()=>aksi.bukaForm({})}>Catat transaksi</button>}/>
        : grup.map(([tanggal,list])=>{
            const net = list.reduce((s,t)=> s+(t.jenis==="masuk"?t.nominal: t.jenis==="keluar"?-t.nominal:0),0);
            return (
              <Kartu key={tanggal} pad={14}>
                <div className="antara" style={{marginBottom:4}}>
                  <span style={{fontSize:12.5,fontWeight:650}}>{labelHari(tanggal)}</span>
                  <span className="num samar">{net>=0?"+":"−"}{nf.format(Math.abs(net))}</span>
                </div>
                {list.map(t=>(
                  <div key={t.id} className="baris" style={{gap:2}}>
                    <div className="isi"><BarisTx t={t} tampilPos klik={()=>aksi.bukaForm(t)}/></div>
                    <button onClick={()=>aksi.hapusTx(t.id)} aria-label="Hapus"
                      style={{color:"var(--samar)",padding:"10px 6px"}}>🗑</button>
                  </div>
                ))}
              </Kartu>
            );
          })}
    </div>
  );
}

/* ================= LAPORAN ================= */
function Laporan({db, aksi}){
  const tahunKini = +hariIni().slice(0,4);
  const mk = bulanIni();
  const [lingkup,setLingkup] = useState("bulan");
  const [tahun,setTahun] = useState(tahunKini);
  const [buka,setBuka] = useState({});

  const daftarTahun = useMemo(()=>{
    const s = new Set(db.transaksi.map(t=>+t.tanggal.slice(0,4))); s.add(tahunKini);
    return [...s].sort((a,b)=>b-a);
  },[db.transaksi]);

  const dalam = t => lingkup==="bulan" ? kunciBulan(t.tanggal)===mk
                 : lingkup==="tahun" ? t.tanggal.slice(0,4)===String(tahun) : true;
  const list = useMemo(()=>db.transaksi.filter(dalam),[db.transaksi,lingkup,tahun]);
  const judulLingkup = lingkup==="bulan"? namaBulan(mk) : lingkup==="tahun"? "Tahun "+tahun : "Sejak awal mencatat";

  const masuk = list.filter(t=>t.jenis==="masuk").reduce((s,t)=>s+t.nominal,0);
  const disisihkan = list.filter(t=>t.jenis==="keluar"&&POS_SIMPAN.includes(kat(t.kategori).pos)).reduce((s,t)=>s+t.nominal,0);
  const belanja = list.filter(t=>t.jenis==="keluar"&&!POS_SIMPAN.includes(kat(t.kategori).pos)).reduce((s,t)=>s+t.nominal,0);
  const rasio = masuk>0 ? Math.round((disisihkan+(masuk-belanja-disisihkan))/masuk*100) : 0;

  const hariAktif = new Set(list.filter(t=>t.jenis==="keluar").map(t=>t.tanggal));
  const bulanAktif = new Set(list.map(t=>kunciBulan(t.tanggal))).size || 1;
  const hariKalender = lingkup==="bulan" ? new Date().getDate() : bulanAktif*30;
  const perHari = list.filter(t=>t.jenis==="keluar"&&!POS_SIMPAN.includes(kat(t.kategori).pos))
    .reduce((m,t)=>{ m[t.tanggal]=(m[t.tanggal]||0)+t.nominal; return m; },{});
  const nilaiHarian = Object.values(perHari).sort((a,b)=>a-b);
  const median = nilaiHarian.length ? nilaiHarian[Math.floor(nilaiHarian.length/2)] : 0;
  const hariBoros = Object.entries(perHari).sort((a,b)=>b[1]-a[1])[0];

  /* pohon: pos → kategori → transaksi terbesar */
  const pohon = useMemo(()=>{
    const posMap = {};
    list.filter(t=>t.jenis==="keluar").forEach(t=>{
      const k = kat(t.kategori), p = k.pos||"keinginan";
      posMap[p] = posMap[p] || {total:0, kat:{}};
      posMap[p].total += t.nominal;
      const c = posMap[p].kat[k.id] = posMap[p].kat[k.id] || {total:0, n:0, tx:[]};
      c.total += t.nominal; c.n++; c.tx.push(t);
    });
    return db.pos.map(p=>({
      ...p,
      total: posMap[p.id]?.total || 0,
      kategori: Object.entries(posMap[p.id]?.kat||{})
        .map(([id,v])=>({...kat(id), ...v, tx:v.tx.sort((a,b)=>b.nominal-a.nominal).slice(0,3)}))
        .sort((a,b)=>b.total-a.total)
    })).filter(p=>p.total>0).sort((a,b)=>b.total-a.total);
  },[list,db.pos]);
  const totalKeluar = pohon.reduce((s,p)=>s+p.total,0);

  const perKategori = useMemo(()=>{
    const m = {};
    list.filter(t=>t.jenis==="keluar").forEach(t=>{ m[t.kategori]=m[t.kategori]||{total:0,n:0}; m[t.kategori].total+=t.nominal; m[t.kategori].n++; });
    const lalu = {};
    if(lingkup==="bulan"){
      db.transaksi.filter(t=>kunciBulan(t.tanggal)===geserBulan(mk,-1)&&t.jenis==="keluar")
        .forEach(t=> lalu[t.kategori]=(lalu[t.kategori]||0)+t.nominal);
    }
    return Object.entries(m).map(([id,v])=>({
      ...kat(id), ...v, rata:v.total/v.n,
      beda: lalu[id]? Math.round((v.total-lalu[id])/lalu[id]*100) : null
    })).sort((a,b)=>b.total-a.total);
  },[list,lingkup,mk,db.transaksi]);

  const terbesar = useMemo(()=> list.filter(t=>t.jenis==="keluar").sort((a,b)=>b.nominal-a.nominal).slice(0,5),[list]);

  const rekapBulan = useMemo(()=>{
    const out=[];
    for(let m=0;m<12;m++){
      const k = `${tahun}-${String(m+1).padStart(2,"0")}`;
      const l = db.transaksi.filter(t=>kunciBulan(t.tanggal)===k);
      const i = l.filter(t=>t.jenis==="masuk").reduce((s,t)=>s+t.nominal,0);
      const o = l.filter(t=>t.jenis==="keluar").reduce((s,t)=>s+t.nominal,0);
      out.push({k, label:BLN[m], penuh:BULAN[m], masuk:i, keluar:o, selisih:i-o, n:l.length});
    }
    return out;
  },[db.transaksi,tahun]);
  const totalTahun = rekapBulan.reduce((a,r)=>({masuk:a.masuk+r.masuk, keluar:a.keluar+r.keluar, n:a.n+r.n}),{masuk:0,keluar:0,n:0});

  const rekapTahun = useMemo(()=>{
    const m={};
    db.transaksi.forEach(t=>{
      const y=t.tanggal.slice(0,4); m[y]=m[y]||{masuk:0,keluar:0,n:0};
      if(t.jenis==="masuk") m[y].masuk+=t.nominal; else if(t.jenis==="keluar") m[y].keluar+=t.nominal;
      m[y].n++;
    });
    return Object.entries(m).sort((a,b)=> a[0]<b[0]?1:-1);
  },[db.transaksi]);

  const enamBulan = useMemo(()=>{
    const out=[];
    for(let i=5;i>=0;i--){
      const k = geserBulan(mk,-i);
      const l = db.transaksi.filter(t=>kunciBulan(t.tanggal)===k);
      out.push({label:BLN[+k.slice(5,7)-1],
        masuk:l.filter(t=>t.jenis==="masuk").reduce((s,t)=>s+t.nominal,0),
        keluar:l.filter(t=>t.jenis==="keluar").reduce((s,t)=>s+t.nominal,0)});
    }
    return out;
  },[db.transaksi,mk]);

  const saldoJalan = useMemo(()=>{
    const m={};
    db.transaksi.forEach(t=>{
      const k=kunciBulan(t.tanggal);
      m[k]=(m[k]||0)+(t.jenis==="masuk"?t.nominal: t.jenis==="keluar"?-t.nominal:0);
    });
    let jalan=0;
    return Object.keys(m).sort().map(k=>{ jalan+=m[k]; return {label:BLN[+k.slice(5,7)-1]+" "+k.slice(2,4), nilai:jalan}; });
  },[db.transaksi]);

  const perMetode = useMemo(()=>{
    const m={};
    list.forEach(t=>{ m[t.metode]=m[t.metode]||{keluar:0,n:0}; if(t.jenis==="keluar") m[t.metode].keluar+=t.nominal; m[t.metode].n++; });
    return Object.entries(m).map(([id,v])=>({...met(id),...v})).sort((a,b)=>b.keluar-a.keluar);
  },[list]);

  const insight = useMemo(()=>{
    const o=[];
    const lalu = belanjaSampaiTgl(db, geserBulan(mk,-1), new Date().getDate());
    const kini = belanjaSampaiTgl(db, mk, new Date().getDate());
    if(lalu>0) o.push(`Sampai tanggal ${new Date().getDate()}, belanja lu ${kini>=lalu?"lebih besar":"lebih kecil"} ${Math.abs(Math.round((kini-lalu)/lalu*100))}% dibanding bulan lalu di tanggal yang sama (${rp(kini)} vs ${rp(lalu)}).`);
    if(perKategori[0]) o.push(`Kategori terbesar: ${perKategori[0].nama} ${rp(perKategori[0].total)} — ${Math.round(perKategori[0].total/(totalKeluar||1)*100)}% dari seluruh pengeluaran.`);
    if(median>0) o.push(`Hari biasa lu habis sekitar ${rp(median)}. Rata-ratanya ${rp(belanja/Math.max(1,hariAktif.size))}, selisihnya datang dari belanja besar sesekali.`);
    if(hariBoros) o.push(`Hari paling boros: ${tglPanjang(hariBoros[0])} sebesar ${rp(hariBoros[1])}.`);
    const kecil = list.filter(t=>t.jenis==="keluar"&&t.nominal<=30000).length;
    if(kecil>=10) o.push(`Ada ${kecil} transaksi kecil di bawah Rp 30.000, totalnya ${rp(list.filter(t=>t.jenis==="keluar"&&t.nominal<=30000).reduce((s,t)=>s+t.nominal,0))}. Bocor halus biasanya di sini.`);
    if(masuk>0) o.push(rasio>=20 ? `Rasio menabung ${rasio}% — di atas anjuran umum 20%.`
      : `Rasio menabung ${rasio}%. Untuk sampai 20%, perlu menyisihkan ${rp(Math.max(0,masuk*0.2-(masuk-belanja)))} lagi.`);
    return o;
  },[list,perKategori,median,hariBoros,masuk,rasio,belanja]);

  /* ekspor */
  const unduh = (isi,nama,tipe)=>{
    try{
      const b=new Blob([isi],{type:tipe}), u=URL.createObjectURL(b);
      const a=document.createElement("a"); a.href=u; a.download=nama; a.click();
      setTimeout(()=>URL.revokeObjectURL(u),1000);
      aksi.roti("Terunduh: "+nama);
    }catch(e){ aksi.roti("Unduhan diblokir peramban."); }
  };
  const P = db.setelan.pemisahCsv || ";";
  const csv = (baris,nama)=> unduh("﻿"+baris.map(r=>r.join(P)).join("\n"), nama, "text/csv;charset=utf-8");
  const eksporTx = ()=>{
    const b=[["Tanggal","Jenis","Kategori","Pos","Nominal","Metode","Untuk apa"]];
    list.forEach(t=>b.push([t.tanggal, t.jenis==="masuk"?"Pemasukan":t.jenis==="pindah"?"Pindah":"Pengeluaran",
      kat(t.kategori).nama, t.jenis==="keluar"?(kat(t.kategori).pos||""):"", t.nominal, met(t.metode).nama,
      (t.catatan||"").replace(new RegExp("["+P+"\n]","g")," ")]));
    csv(b, `transaksi-${lingkup==="tahun"?tahun:lingkup==="bulan"?mk:"semua"}.csv`);
  };
  const eksporRekap = ()=>{
    const b=[["Bulan","Pemasukan","Pengeluaran","Selisih","Jumlah transaksi"]];
    rekapBulan.forEach(r=>b.push([r.penuh,r.masuk,r.keluar,r.selisih,r.n]));
    b.push(["TOTAL "+tahun,totalTahun.masuk,totalTahun.keluar,totalTahun.masuk-totalTahun.keluar,totalTahun.n]);
    b.push([""]);
    b.push(["Kategori","Total","Transaksi","Rata-rata","Persen"]);
    perKategori.forEach(k=>b.push([k.nama,k.total,k.n,Math.round(k.rata),Math.round(k.total/(totalKeluar||1)*100)+"%"]));
    csv(b,`rekap-${tahun}.csv`);
  };
  const salin = ()=>{
    const teks = `Ringkasan ${judulLingkup}\nMasuk: ${rp(masuk)}\nBelanja: ${rp(belanja)}\nDisisihkan: ${rp(disisihkan)}\nSelisih: ${rp(masuk-belanja-disisihkan)}\n\n`
      + perKategori.slice(0,8).map(k=>`${k.nama}: ${rp(k.total)}`).join("\n");
    navigator.clipboard?.writeText(teks).then(()=>aksi.roti("Ringkasan disalin"), ()=>aksi.roti("Gagal menyalin"));
  };

  return (
    <div className="blok">
      <div className="pils">
        {[["bulan","Bulan ini"],["tahun","Per tahun"],["semua","Seumur hidup"]].map(([id,l])=>(
          <button key={id} className={"pil"+(lingkup===id?" aktif":"")} onClick={()=>setLingkup(id)}>{l}</button>
        ))}
        {lingkup==="tahun" && (
          <select value={tahun} onChange={e=>setTahun(+e.target.value)} style={{width:"auto",padding:"7px 10px",borderRadius:999,fontSize:12.5}}>
            {daftarTahun.map(y=><option key={y} value={y}>{y}</option>)}
          </select>
        )}
      </div>

      <Kartu judul={"Ringkasan · "+judulLingkup}>
        <div className="grid2" style={{gap:12}}>
          <div><div className="samar">Total masuk</div><div className="num naik" style={{fontSize:17,fontWeight:700}}>{rp(masuk)}</div></div>
          <div><div className="samar">Belanja murni</div><div className="num turun" style={{fontSize:17,fontWeight:700}}>{rp(belanja)}</div></div>
          <div><div className="samar">Disisihkan ke tabungan</div><div className="num" style={{fontSize:15,fontWeight:650}}>{rp(disisihkan)}</div></div>
          <div><div className="samar">Sisa belum teralokasi</div><div className="num" style={{fontSize:15,fontWeight:650}}>{rp(masuk-belanja-disisihkan)}</div></div>
        </div>
        <div className="peringatan p-info" style={{marginTop:12}}>
          <span>ℹ️</span>
          <div>Uang yang lu pindahkan ke tabungan tidak dihitung sebagai belanja — itu masih uang lu. Makanya “belanja murni” dipisah.</div>
        </div>
        <div className="grid2" style={{marginTop:12,borderTop:"1px solid var(--garis)",paddingTop:12,gap:12}}>
          <div><div className="samar">Rasio menabung</div><div className="num" style={{fontWeight:650}}>{rasio}%</div></div>
          <div><div className="samar">Rata-rata per hari</div><div className="num" style={{fontWeight:650}}>{rp(belanja/Math.max(1,hariKalender))}</div></div>
          <div><div className="samar">Median harian</div><div className="num" style={{fontWeight:650}}>{rp(median)}</div></div>
          <div><div className="samar">Jumlah transaksi</div><div className="num" style={{fontWeight:650}}>{list.length}</div></div>
        </div>
      </Kartu>

      {/* Uang ke mana */}
      <Kartu judul={`Uang ${rp(totalKeluar)} ini ke mana?`}>
        {pohon.length===0 ? <Kosong ikon="📊" teks="Belum ada pengeluaran pada periode ini."/> : (
          <div style={{display:"grid",gap:10}}>
            {pohon.map(p=>(
              <div key={p.id} style={{border:"1px solid var(--garis)",borderRadius:14,overflow:"hidden"}}>
                <button onClick={()=>setBuka({...buka,[p.id]:!buka[p.id]})}
                  style={{width:"100%",padding:"11px 13px",textAlign:"left"}}>
                  <div className="antara">
                    <span className="baris" style={{gap:8,fontSize:13.5,fontWeight:600}}>
                      <i style={{width:10,height:10,borderRadius:3,background:p.warna,display:"block"}}/>
                      {p.ikon} {p.nama}
                    </span>
                    <span className="num" style={{fontWeight:650}}>{rp(p.total)}</span>
                  </div>
                  <div style={{marginTop:7}}><Bar persen={p.total/(totalKeluar||1)*100} warna={p.warna}/></div>
                  <div className="samar" style={{marginTop:4}}>
                    {Math.round(p.total/(totalKeluar||1)*100)}% dari total · {p.kategori.length} kategori · ketuk untuk rincian {buka[p.id]?"▴":"▾"}
                  </div>
                </button>
                {buka[p.id] && (
                  <div style={{padding:"0 13px 12px",borderTop:"1px solid var(--garis)"}}>
                    {p.kategori.map(k=>(
                      <div key={k.id} style={{marginTop:11}}>
                        <div className="antara" style={{fontSize:13}}>
                          <span>{k.ikon} {k.nama} <span className="samar">({k.n}×)</span></span>
                          <span className="num" style={{fontWeight:600}}>{rp(k.total)}</span>
                        </div>
                        <div style={{marginTop:5,paddingLeft:10,borderLeft:"2px solid var(--garis)"}}>
                          {k.tx.map(t=>(
                            <div key={t.id} className="antara samar" style={{padding:"3px 0"}}>
                              <span className="potong">{t.catatan||"tanpa catatan"} · {tglPendek(t.tanggal)}</span>
                              <span className="num">{rp(t.nominal)}</span>
                            </div>
                          ))}
                          {k.n>3 && <div className="samar">+{k.n-3} transaksi lain</div>}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </Kartu>

      {perKategori.length>0 && (
        <Kartu judul="Bagan kategori">
          <div style={{display:"flex",flexWrap:"wrap",gap:16,alignItems:"center",justifyContent:"center"}}>
            <Donat data={perKategori.map(k=>({nilai:k.total,warna:k.warna}))} tengah={rpk(totalKeluar)} bawah="total keluar"/>
            <div style={{flex:"1 1 220px",display:"grid",gap:6}}>
              {perKategori.slice(0,8).map(k=>(
                <div key={k.id} className="baris" style={{fontSize:12.5}}>
                  <i style={{width:10,height:10,borderRadius:3,background:k.warna,display:"block"}}/>
                  <span className="isi potong">{k.nama}</span>
                  <span className="samar">{Math.round(k.total/(totalKeluar||1)*100)}%</span>
                  <span className="num" style={{width:86,textAlign:"right"}}>{rpk(k.total)}</span>
                </div>
              ))}
            </div>
          </div>

          <div style={{overflowX:"auto",marginTop:14}}>
            <table className="tabel">
              <thead><tr><th>Kategori</th><th className="ka">Total</th><th className="ka">Kali</th><th className="ka">Rata-rata</th>{lingkup==="bulan"&&<th className="ka">vs lalu</th>}</tr></thead>
              <tbody>
                {perKategori.map(k=>(
                  <tr key={k.id}>
                    <td>{k.ikon} {k.nama}</td>
                    <td className="ka num">{rpk(k.total)}</td>
                    <td className="ka num samar">{k.n}×</td>
                    <td className="ka num samar">{rpk(k.rata)}</td>
                    {lingkup==="bulan" && <td className={"ka num "+(k.beda==null?"samar":k.beda>0?"turun":"naik")}>
                      {k.beda==null?"–":(k.beda>0?"+":"")+k.beda+"%"}</td>}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Kartu>
      )}

      {terbesar.length>0 && (
        <Kartu judul="5 pengeluaran terbesar">
          {terbesar.map(t=>(
            <div key={t.id} className="antara" style={{padding:"7px 0",borderBottom:"1px solid var(--garis)"}}>
              <div className="isi potong" style={{fontSize:13}}>
                {kat(t.kategori).ikon} {t.catatan||kat(t.kategori).nama}
                <span className="samar" style={{display:"block"}}>{tglPendek(t.tanggal)} · {kat(t.kategori).nama}</span>
              </div>
              <span className="num turun" style={{fontWeight:650}}>{rp(t.nominal)}</span>
            </div>
          ))}
        </Kartu>
      )}

      <Kartu judul="Masuk vs keluar (6 bulan terakhir)"><BatangGrup data={enamBulan}/></Kartu>

      {saldoJalan.length>1 && (
        <Kartu judul="Perjalanan saldo"><Garis data={saldoJalan}/>
          <div className="samar" style={{marginTop:6}}>Saldo akhir tiap bulan sejak catatan pertama.</div>
        </Kartu>
      )}

      <Kartu judul={"Rekap bulanan "+tahun} aksi={
        <select value={tahun} onChange={e=>setTahun(+e.target.value)} style={{width:"auto",padding:"5px 8px",fontSize:12}}>
          {daftarTahun.map(y=><option key={y} value={y}>{y}</option>)}
        </select>}>
        <div style={{overflowX:"auto"}}>
          <table className="tabel">
            <thead><tr><th>Bulan</th><th className="ka">Masuk</th><th className="ka">Keluar</th><th className="ka">Selisih</th></tr></thead>
            <tbody>
              {rekapBulan.map(r=>(
                <tr key={r.k}>
                  <td style={{fontWeight:550}}>{r.label}</td>
                  <td className="ka num naik">{r.masuk?rpk(r.masuk):"–"}</td>
                  <td className="ka num turun">{r.keluar?rpk(r.keluar):"–"}</td>
                  <td className={"ka num "+(r.selisih<0?"turun":"")}>{r.n?rpk(r.selisih):"–"}</td>
                </tr>
              ))}
              <tr style={{fontWeight:700}}>
                <td>Total</td>
                <td className="ka num naik">{rpk(totalTahun.masuk)}</td>
                <td className="ka num turun">{rpk(totalTahun.keluar)}</td>
                <td className="ka num">{rpk(totalTahun.masuk-totalTahun.keluar)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </Kartu>

      {rekapTahun.length>0 && (
        <Kartu judul="Rekap per tahun">
          {rekapTahun.map(([y,v])=>(
            <button key={y} onClick={()=>{setTahun(+y); setLingkup("tahun");}}
              style={{display:"flex",width:"100%",gap:10,alignItems:"center",padding:"8px 0",textAlign:"left"}}>
              <span className="num" style={{width:46,fontWeight:650}}>{y}</span>
              <div className="isi">
                <Bar persen={v.masuk>0? v.keluar/v.masuk*100 : 100} warna={v.keluar>v.masuk?"var(--merah)":"var(--hijau2)"}/>
                <div className="samar" style={{marginTop:3}}>Masuk {rpk(v.masuk)} · Keluar {rpk(v.keluar)} · {v.n} transaksi</div>
              </div>
              <span className={"num "+(v.masuk-v.keluar<0?"turun":"naik")} style={{fontWeight:650}}>{rpk(v.masuk-v.keluar)}</span>
            </button>
          ))}
        </Kartu>
      )}

      {perMetode.length>0 && (
        <Kartu judul="Metode pembayaran">
          {perMetode.map(m=>(
            <div key={m.id} className="antara" style={{padding:"6px 0",fontSize:13}}>
              <span>{m.ikon} {m.nama}</span>
              <span className="baris" style={{gap:10}}>
                <span className="samar">{m.n}×</span>
                <span className="num turun" style={{width:92,textAlign:"right"}}>{m.keluar?rp(m.keluar):"–"}</span>
              </span>
            </div>
          ))}
        </Kartu>
      )}

      <Kartu judul="Insight">
        <div style={{display:"grid",gap:8}}>
          {insight.map((s,i)=><div key={i} className="peringatan p-info"><span>💡</span><div>{s}</div></div>)}
        </div>
      </Kartu>

      <Kartu judul="Ekspor & cetak">
        <div className="grid2" style={{gap:8}}>
          <button className="tbl" onClick={eksporTx}>⬇ Transaksi CSV</button>
          <button className="tbl" onClick={eksporRekap}>⬇ Rekap {tahun}</button>
          <button className="tbl" onClick={salin}>📋 Salin ringkasan</button>
          <button className="tbl" onClick={()=>window.print()}>🖨 Cetak / PDF</button>
        </div>
        <div className="baris" style={{marginTop:10,gap:8,fontSize:12.5}}>
          <span className="samar">Pemisah CSV</span>
          {[[";","titik koma (Excel ID)"],[",","koma (Google Sheets)"]].map(([v,l])=>(
            <button key={v} className={"pil"+(P===v?" aktif":"")} onClick={()=>aksi.setSetelan({pemisahCsv:v})}>{l}</button>
          ))}
        </div>
      </Kartu>
    </div>
  );
}

/* ================= RENCANA: anggaran, tagihan, tujuan ================= */
function Rencana({db, aksi}){
  const mk = bulanIni(), tgl = new Date().getDate();
  const R = ringkasBulan(db,mk);
  const [sub,setSub]             = useState("alokasi");
  const [fAnggaran,setFAnggaran] = useState(null);
  const [fTagihan,setFTagihan]   = useState(null);
  const [fTujuan,setFTujuan]     = useState(null);
  const [setor,setSetor]         = useState(null);

  /* Kemampuan nabung: rata-rata sisa uang dari bulan-bulan penuh terakhir.
     Dipakai untuk menguji apakah sebuah target masuk akal atau cuma angan-angan. */
  const {kemampuan, bulanDipakai} = useMemo(()=>{
    let total = 0, n = 0;
    for(let i=1;i<=3;i++){
      const k = geserBulan(mk,-i);
      const r = ringkasBulan(db,k);
      if(r.list.length===0) continue;
      total += (r.masuk - r.belanja); n++;
    }
    if(n===0){ const r = ringkasBulan(db,mk); return {kemampuan: Math.max(0,r.masuk-r.belanja), bulanDipakai:1}; }
    return {kemampuan: Math.max(0, Math.round(total/n)), bulanDipakai:n};
  },[db.transaksi, mk]);

  const anggaran = db.anggaran.filter(a=>a.bulan===mk);
  const tagihan  = tagihanBulan(db,mk).sort((a,b)=>a.tanggal-b.tanggal);
  const totalTagihan = tagihan.reduce((s,t)=>s+t.nominal,0);
  const sudah = tagihan.filter(t=>t.lunas).reduce((s,t)=>s+t.nominal,0);

  return (
    <div className="blok">
      <div className="pils">
        {[["alokasi","Alokasi"],["tagihan","Tagihan"],["target","Target"]].map(([id,l])=>(
          <button key={id} className={"pil"+(sub===id?" aktif":"")} onClick={()=>setSub(id)}>{l}</button>
        ))}
      </div>

      {sub==="alokasi" && <Alokasi db={db} aksi={aksi}/>}

      {sub==="alokasi" && (<>
        {/* Anggaran kategori */}
        <Kartu judul={`Anggaran ${namaBulan(mk)}`}
          aksi={<button className="tbl" style={{padding:"7px 11px",minHeight:34}} onClick={()=>setFAnggaran({})}>+ Tambah</button>}>
          <div className="samar" style={{marginBottom:10}}>Batas halus per kategori, di dalam pos alokasi. Pakai kalau ada kategori yang sering kebablasan.</div>
          {anggaran.length===0
            ? <Kosong ikon="🎯" teks="Belum ada anggaran kategori."/>
            : <div style={{display:"grid",gap:13}}>
                {anggaran.map(a=>{
                  const k = kat(a.kategori);
                  const kepakai = R.list.filter(t=>t.jenis==="keluar"&&t.kategori===a.kategori).reduce((s,t)=>s+t.nominal,0);
                  const pct = kepakai/a.batas*100;
                  return (
                    <div key={a.id}>
                      <div className="antara" style={{marginBottom:4}}>
                        <button onClick={()=>setFAnggaran(a)} style={{fontSize:13.5,fontWeight:550}}>{k.ikon} {k.nama}</button>
                        <span className="baris" style={{gap:8}}>
                          <span className="num samar" style={{color:pct>=90?"var(--merah)":"var(--redup)"}}>{rpk(kepakai)} / {rpk(a.batas)}</span>
                          <button onClick={()=>aksi.hapusAnggaran(a.id)} style={{color:"var(--samar)"}}>🗑</button>
                        </span>
                      </div>
                      <Bar persen={pct}/>
                      <div className="samar" style={{marginTop:3,color:pct>=90?"var(--merah)":"var(--redup)"}}>
                        {kepakai<=a.batas? `Sisa ${rp(a.batas-kepakai)}` : `Lewat ${rp(kepakai-a.batas)}`} · {Math.round(pct)}%
                      </div>
                    </div>
                  );
                })}
              </div>}
        </Kartu>

        {/* Tujuan */}
      </>)}

      {sub==="tagihan" && (<>
        {/* Tagihan rutin */}
        <Kartu judul="Tagihan rutin bulan ini"
          aksi={<button className="tbl" style={{padding:"7px 11px",minHeight:34}} onClick={()=>setFTagihan({})}>+ Tambah</button>}>
          {tagihan.length===0
            ? <Kosong ikon="🧾" teks="Belum ada tagihan rutin. Daftarkan sewa, listrik, internet, dan langganan — ini penyebab utama budget bocor."/>
            : <>
                <div className="antara" style={{marginBottom:10}}>
                  <span className="samar">{rp(sudah)} dari {rp(totalTagihan)} sudah dibayar</span>
                  <span className="num samar">{Math.round(sudah/(totalTagihan||1)*100)}%</span>
                </div>
                <Bar persen={sudah/(totalTagihan||1)*100} warna="var(--hijau2)"/>
                <div style={{marginTop:12,display:"grid",gap:9}}>
                  {tagihan.map(t=>{
                    const selisih = t.tanggal - tgl;
                    const status = t.lunas ? "lunas" : selisih<0 ? "telat" : selisih<=3 ? "dekat" : "aman";
                    const warna = {lunas:"var(--hijau)", telat:"var(--merah)", dekat:"var(--kuning)", aman:"var(--redup)"}[status];
                    return (
                      <div key={t.id} className="baris" style={{gap:10,border:"1px solid var(--garis)",borderRadius:13,padding:"10px 12px"}}>
                        <div className="ikon" style={{background:"var(--lembut)"}}>{kat(t.kategori).ikon}</div>
                        <button className="isi" style={{textAlign:"left"}} onClick={()=>setFTagihan(t)}>
                          <div style={{fontSize:13.5,fontWeight:600}}>{t.nama}</div>
                          <div className="samar" style={{color:warna}}>
                            Tiap tanggal {t.tanggal} · {t.lunas?"sudah dibayar":selisih<0?`telat ${-selisih} hari`:selisih===0?"jatuh tempo hari ini":`${selisih} hari lagi`}
                          </div>
                        </button>
                        <div style={{textAlign:"right"}}>
                          <div className="num" style={{fontWeight:650,fontSize:13.5}}>{rp(t.nominal)}</div>
                          {!t.lunas && <button className="tbl" style={{padding:"5px 9px",minHeight:30,marginTop:4,fontSize:11.5}}
                            onClick={()=>aksi.bayarTagihan(t)}>Tandai lunas</button>}
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div className="samar" style={{marginTop:10}}>“Tandai lunas” sekaligus membuat transaksi pengeluarannya, jadi tidak perlu catat dua kali.</div>
              </>}
        </Kartu>
      </>)}

      {sub==="target" && (<>
        <Kartu judul="Target & barang incaran"
          aksi={<button className="tbl" style={{padding:"7px 11px",minHeight:34}} onClick={()=>setFTujuan({})}>+ Target</button>}>
          {db.tujuan.length===0
            ? <Kosong ikon="🎯" teks="Mau beli sesuatu? Tulis barangnya dan harganya di sini, nanti dihitungkan berapa harus nabung."
                aksi={<button className="tbl tbl-utama" onClick={()=>setFTujuan({})}>Tambah target</button>}/>
            : <div style={{display:"grid",gap:12}}>
                {db.tujuan.map(g=>{
                  const kurang = Math.max(0, g.target - g.terkumpul);
                  const pct = Math.min(100, g.terkumpul/(g.target||1)*100);
                  const selesai = kurang<=0;
                  const sisaHari = g.tenggat? Math.ceil((new Date(g.tenggat)-new Date())/864e5) : null;
                  const perBulan = sisaHari && sisaHari>0 ? kurang/Math.max(1,sisaHari/30) : 0;
                  const perHari  = sisaHari && sisaHari>0 ? kurang/sisaHari : 0;
                  /* uji kewajaran: targetnya masuk akal nggak dibanding sisa uang bulanan lu */
                  const masukAkal = kemampuan<=0 ? null : perBulan<=kemampuan;
                  const bulanButuh = kemampuan>0 ? Math.ceil(kurang/kemampuan) : null;
                  const tunggu = g.tungguSampai ? Math.ceil((new Date(g.tungguSampai)-new Date())/864e5) : 0;
                  return (
                    <div key={g.id} style={{border:"1px solid var(--garis)",borderRadius:14,padding:13}}>
                      <div className="antara" style={{alignItems:"flex-start"}}>
                        <button onClick={()=>setFTujuan(g)} style={{textAlign:"left"}}>
                          <div style={{fontSize:14,fontWeight:650}}>{g.ikon||"🎯"} {g.nama}</div>
                          <div className="samar">
                            Harga {rp(g.target)}
                            {sisaHari!==null && " · " + (sisaHari>0 ? `${sisaHari} hari lagi` : "lewat tenggat")}
                          </div>
                          {g.hargaCatatan && <div className="samar potong">{g.hargaCatatan}</div>}
                        </button>
                        <button onClick={()=>aksi.hapusTujuan(g.id)} style={{color:"var(--samar)"}}>🗑</button>
                      </div>

                      <div style={{marginTop:9}}><Bar persen={pct} warna={selesai?"var(--hijau)":undefined}/></div>
                      <div className="antara" style={{marginTop:6}}>
                        <span className="num" style={{fontSize:13}}>
                          {rp(g.terkumpul)} <span className="samar">({Math.round(pct)}%)</span>
                        </span>
                        {!selesai && <span className="samar num">kurang {rp(kurang)}</span>}
                      </div>

                      {!selesai && (
                        <div style={{marginTop:10,background:"var(--lembut)",borderRadius:12,padding:"10px 12px"}}>
                          {sisaHari && sisaHari>0 ? (
                            <>
                              <div className="antara">
                                <span className="samar">Harus nabung</span>
                                <span className="num" style={{fontWeight:650}}>{rpk(perBulan)}/bulan</span>
                              </div>
                              <div className="antara" style={{marginTop:3}}>
                                <span className="samar">Setara</span>
                                <span className="num">{rpk(perHari)}/hari</span>
                              </div>
                            </>
                          ) : bulanButuh ? (
                            <div className="antara">
                              <span className="samar">Dengan kemampuan sekarang</span>
                              <span className="num" style={{fontWeight:650}}>{bulanButuh} bulan lagi</span>
                            </div>
                          ) : (
                            <div className="samar">Isi tenggat supaya bisa dihitung target nabungnya.</div>
                          )}
                          {masukAkal===false && (
                            <div className="turun" style={{marginTop:7,fontSize:12}}>
                              ⚠️ Sisa uang lu rata-rata {rpk(kemampuan)}/bulan. Target ini butuh {rpk(perBulan)}/bulan —
                              belum masuk akal. Mundurkan tenggatnya, atau turunkan harganya.
                            </div>
                          )}
                          {masukAkal===true && (
                            <div className="naik" style={{marginTop:7,fontSize:12}}>
                              ✅ Masuk akal. Sisa uang lu rata-rata {rpk(kemampuan)}/bulan.
                            </div>
                          )}
                        </div>
                      )}

                      {tunggu>0 && (
                        <div className="peringatan p-waspada" style={{marginTop:10}}>
                          <span>⏳</span>
                          <div>Masa tunggu {tunggu} hari lagi. Kalau sesudah itu masih pengen, berarti memang butuh.</div>
                        </div>
                      )}

                      <div className="baris" style={{gap:8,marginTop:10,flexWrap:"wrap"}}>
                        <button className="tbl" style={{padding:"6px 11px",minHeight:34,fontSize:12}} onClick={()=>setSetor(g)}>+ Setor</button>
                        {selesai && g.status!=="dibeli" && (
                          <button className="tbl tbl-utama" style={{padding:"6px 11px",minHeight:34,fontSize:12}}
                            disabled={tunggu>0} onClick={()=>aksi.tandaiDibeli(g)}>
                            {tunggu>0? `Tunggu ${tunggu} hari` : "Sudah dibeli"}
                          </button>
                        )}
                        {g.status==="dibeli" && <span className="naik" style={{fontSize:12,fontWeight:600}}>🎉 Sudah dibeli</span>}
                        {selesai && g.status!=="dibeli" && tunggu<=0 && <span className="naik" style={{fontSize:12,fontWeight:600}}>Dana siap</span>}
                      </div>
                    </div>
                  );
                })}
              </div>}
          <div className="samar" style={{marginTop:11}}>
            Kemampuan nabung dihitung dari rata-rata sisa uang {bulanDipakai} bulan terakhir: {rpk(kemampuan)} per bulan.
          </div>
        </Kartu>
      </>)}

      <FormAnggaran item={fAnggaran} tutup={()=>setFAnggaran(null)} simpan={aksi.simpanAnggaran} mk={mk}/>
      <FormTagihan  item={fTagihan}  tutup={()=>setFTagihan(null)}  simpan={aksi.simpanTagihan} hapus={aksi.hapusTagihan}/>
      <FormTujuan   item={fTujuan}   tutup={()=>setFTujuan(null)}   simpan={aksi.simpanTujuan} hariTunggu={db.setelan.hariTunggu||7}/>
      <FormSetor    item={setor}     tutup={()=>setSetor(null)}     simpan={aksi.setorTujuan}/>
    </div>
  );
}

function FormAnggaran({item, tutup, simpan, mk}){
  const [kategori,setKat] = useState("makanan");
  const [batas,setBatas]  = useState("");
  useEffect(()=>{ if(!item) return; setKat(item.kategori||"makanan"); setBatas(item.batas?nf.format(item.batas):""); },[item]);
  return (
    <Lembar buka={!!item} tutup={tutup} judul={item&&item.id?"Ubah anggaran":"Tambah anggaran"}>
      <Bidang label="Kategori">
        <select value={kategori} onChange={e=>setKat(e.target.value)}>
          {KAT_KELUAR.map(k=><option key={k.id} value={k.id}>{k.ikon} {k.nama}</option>)}
        </select>
      </Bidang>
      <Bidang label="Batas per bulan"><InputNominal nilai={batas} set={setBatas}/></Bidang>
      <button className="tbl tbl-utama tbl-penuh" style={{marginTop:14}}
        onClick={()=>{ if(angka(batas)>0){ simpan({id:item.id||uid(), kategori, batas:angka(batas), bulan:item.bulan||mk}); tutup(); } }}>
        Simpan anggaran
      </button>
    </Lembar>
  );
}

function FormTagihan({item, tutup, simpan, hapus}){
  const [nama,setNama] = useState("");
  const [nominal,setNominal] = useState("");
  const [tanggal,setTanggal] = useState(1);
  const [kategori,setKat] = useState("tagihan");
  const [metode,setMetode] = useState("bank");

    if(!item) return;
    setNama(item.nama||""); setNominal(item.nominal?nf.format(item.nominal):"");

  },[item]);
  return (
    <Lembar buka={!!item} tutup={tutup} judul={item&&item.id?"Ubah tagihan":"Tagihan rutin"}>

      <Bidang label="Nominal"><InputNominal nilai={nominal} set={setNominal}/></Bidang>
      <div className="grid2" style={{marginTop:12}}>
        <Bidang label="Jatuh tempo tiap tanggal">
          <select value={tanggal} onChange={e=>setTanggal(+e.target.value)}>
            {Array.from({length:28},(_,i)=>i+1).map(d=><option key={d} value={d}>{d}</option>)}
          </select>
        </Bidang>
        <Bidang label="Bayar pakai">
          <select value={metode} onChange={e=>setMetode(e.target.value)}>
            {DAFTAR_AKUN.map(m=><option key={m.id} value={m.id}>{m.ikon} {m.nama}</option>)}
          </select>

      </div>
      <Bidang label="Kategori">
        <select value={kategori} onChange={e=>setKat(e.target.value)}>

        </select>
      </Bidang>
      <div className="samar" style={{marginTop:10}}>Tanggal dibatasi sampai 28 supaya tetap jalan di bulan Februari.</div>
      <div className="baris" style={{gap:8,marginTop:14}}>
        {item&&item.id && <button className="tbl" style={{color:"var(--merah)"}} onClick={()=>{hapus(item.id); tutup();}}>🗑</button>}
        <button className="tbl tbl-utama tbl-penuh"
          onClick={()=>{ if(nama.trim()&&angka(nominal)>0){

          Simpan tagihan

function FormTujuan({item, tutup, simpan, hariTunggu}){
  const [nama,setNama] = useState("");
  const [ikon,setIkon] = useState("🎯");
  const [target,setTarget] = useState("");
  const [terkumpul,setTerkumpul] = useState("");
  const [tenggat,setTenggat] = useState("");
  const [catatan,setCatatan] = useState("");
  const [akunSimpan,setAkun] = useState("bank");
  const [pakaiTunggu,setTunggu] = useState(false);
  useEffect(()=>{
    if(!item) return;
    setNama(item.nama||""); setIkon(item.ikon||"🎯");
    setTarget(item.target?nf.format(item.target):""); setTerkumpul(item.terkumpul?nf.format(item.terkumpul):"");
    setTenggat(item.tenggat||""); setCatatan(item.hargaCatatan||"");
    setAkun(item.akunSimpan||"bank"); setTunggu(!!item.tungguSampai);
  },[item]);

  const lama = item && item.id;
  const nilai = angka(target), punya = angka(terkumpul);
  const sisaHari = tenggat ? Math.ceil((new Date(tenggat)-new Date())/864e5) : 0;
  const perBulan = sisaHari>0 ? Math.max(0,(nilai-punya))/Math.max(1,sisaHari/30) : 0;

  const cepat = n => { const d=new Date(); d.setMonth(d.getMonth()+n); setTenggat(iso(d)); };

  return (
    <Lembar buka={!!item} tutup={tutup} judul={lama? "Ubah target" : "Target baru"}>
      <Bidang label="Mau beli apa / ngumpulin buat apa">
        <input value={nama} onChange={e=>setNama(e.target.value)} placeholder="Contoh: Laptop kerja" autoFocus/>
      </Bidang>
      <Bidang label="Harganya berapa"><InputNominal nilai={target} set={setTarget}/></Bidang>
      <Bidang label="Catatan harga" petunjuk="Toko mana, varian apa, atau kapan terakhir cek harga.">
        <input value={catatan} onChange={e=>setCatatan(e.target.value)} placeholder="Contoh: harga Tokopedia, cek lagi nanti"/>
      </Bidang>

      <Bidang label="Ikon">
        <div className="pils">
          {["🎯","🛟","💻","📱","🏍️","🚗","🏠","🕋","✈️","🎓","💍","👶","📷","⌚"].map(e=>(
            <button key={e} className={"pil"+(ikon===e?" aktif":"")} onClick={()=>setIkon(e)} style={{fontSize:16}}>{e}</button>
          ))}
        </div>
      </Bidang>

      <div className="grid2" style={{marginTop:12}}>
        <Bidang label="Sudah punya">
          <input inputMode="numeric" className="num" value={terkumpul}
            onChange={e=>setTerkumpul(ketik(e.target.value))} placeholder="0"/>
        </Bidang>
        <Bidang label="Mau tercapai kapan">
          <input type="date" value={tenggat} onChange={e=>setTenggat(e.target.value)}/>
        </Bidang>
      </div>
      <div className="pils" style={{marginTop:7}}>
        {[[3,"3 bulan"],[6,"6 bulan"],[12,"1 tahun"],[24,"2 tahun"]].map(([n,l])=>(
          <button key={n} className="pil" onClick={()=>cepat(n)}>{l}</button>
        ))}
      </div>

      {nilai>0 && sisaHari>0 && (
        <div className="peringatan p-info" style={{marginTop:12}}>
          <span>🧮</span>
          <div>Perlu nabung <b className="num">{rpk(perBulan)}</b> per bulan,
            atau sekitar <b className="num">{rpk(perBulan/30)}</b> per hari.</div>
        </div>
      )}

      <Bidang label="Simpan uangnya di akun mana">
        <select value={akunSimpan} onChange={e=>setAkun(e.target.value)}>
          {DAFTAR_AKUN.filter(a=>a.jenis!=="kartu").map(a=><option key={a.id} value={a.id}>{a.ikon} {a.nama}</option>)}
        </select>
      </Bidang>

      {!lama && (
        <label className="baris" style={{gap:9,marginTop:12,background:"var(--lembut)",padding:"10px 12px",borderRadius:12,cursor:"pointer"}}>
          <input type="checkbox" checked={pakaiTunggu} onChange={e=>setTunggu(e.target.checked)}
            style={{width:18,height:18,padding:0,flex:"0 0 18px",accentColor:"#047857"}}/>
          <span style={{fontSize:12.5}}>Pakai masa tunggu {hariTunggu} hari
            <span className="samar" style={{display:"block"}}>Walau dananya cukup, tombol beli baru aktif sesudah {hariTunggu} hari. Penangkal belanja impulsif.</span></span>
        </label>
      )}

      <button className="tbl tbl-utama tbl-penuh" style={{marginTop:14}}
        onClick={()=>{
          if(!nama.trim() || nilai<=0) return;
          const tungguSampai = pakaiTunggu && !lama
            ? iso(new Date(Date.now()+hariTunggu*864e5))
            : (item.tungguSampai||null);
          simpan({id:item.id||uid(), nama:nama.trim(), ikon, target:nilai, terkumpul:punya,
            tenggat:tenggat||null, hargaCatatan:catatan.trim(), akunSimpan,
            status:item.status||"nabung", tungguSampai, dibuat:item.dibuat||Date.now()});
          tutup();
        }}>Simpan target</button>
    </Lembar>
  );
}

function FormSetor({item, tutup, simpan}){
  const [nominal,setNominal] = useState("");
  const [catat,setCatat] = useState(true);
  useEffect(()=>{ if(item) { setNominal(""); setCatat(true);} },[item]);
  return (
    <Lembar buka={!!item} tutup={tutup} judul={item? "Setor ke "+item.nama : ""}>
      <InputNominal nilai={nominal} set={setNominal} fokus/>
      <div className="pils" style={{marginTop:10}}>
        {[100000,250000,500000,1000000].map(n=>(
          <button key={n} className="pil" onClick={()=>setNominal(nf.format(n))}>{rpk(n)}</button>
        ))}
      </div>
      <label className="baris" style={{gap:9,marginTop:14,background:"var(--lembut)",padding:"10px 12px",borderRadius:12,cursor:"pointer"}}>
        <input type="checkbox" checked={catat} onChange={e=>setCatat(e.target.checked)}
          style={{width:18,height:18,padding:0,flex:"0 0 18px",accentColor:"#047857"}}/>
        <span style={{fontSize:12.5}}>Catat juga sebagai transaksi Tabungan
          <span className="samar" style={{display:"block"}}>Supaya saldo dan laporan ikut menyesuaikan</span></span>
      </label>
      <button className="tbl tbl-utama tbl-penuh" style={{marginTop:14}}
        onClick={()=>{ if(angka(nominal)>0){ simpan(item, angka(nominal), catat); tutup(); } }}>Simpan setoran</button>
    </Lembar>
  );
}

/* ================= UANG: akun, sebaran, kekayaan bersih ================= */
function Uang({db, aksi}){
  const [form,setForm] = useState(null);
  const [formAkun,setFormAkun] = useState(null);
  const [sesuaikan,setSesuaikan] = useState(null);
  const [bukaAset,setBukaAset] = useState(false);

  const akun = saldoPerAkun(db);
  const kas = akun.filter(a=>a.jenis!=="kartu");
  const kartu = akun.filter(a=>a.jenis==="kartu");
  const totalKas = kas.reduce((s,a)=>s+a.saldo,0);
  const terpakaiKartu = kartu.reduce((s,a)=>s+Math.max(0,-a.saldo),0);

  const asetLain = db.aset.filter(a=>a.jenis==="aset");
  const hutangLain = db.aset.filter(a=>a.jenis==="hutang");
  const totalAset = totalKas + asetLain.reduce((s,a)=>s+a.nominal,0);
  const totalHutang = terpakaiKartu + hutangLain.reduce((s,a)=>s+a.nominal,0);
  const bersih = totalAset - totalHutang;

  const dataDonat = kas.filter(a=>a.saldo>0).map(a=>({label:a.nama, nilai:a.saldo, warna:a.warna}));

  return (
    <div className="blok">
      {/* Uang yang lu pegang sekarang */}
      <div className="puncak">
        <div className="samar">Uang yang lu pegang sekarang</div>
        <div className="num" style={{fontSize:28,fontWeight:700,marginTop:2}}>{rp(totalKas)}</div>
        <div className="samar" style={{marginTop:4}}>Dari {kas.length} dompet & rekening, belum dipotong hutang</div>
        {terpakaiKartu>0 && (
          <div className="kotakputih" style={{marginTop:11}}>
            <div className="antara">
              <span className="samar">Terpakai di kartu kredit</span>
              <span className="num" style={{fontWeight:650}}>{rp(terpakaiKartu)}</span>
            </div>
          </div>
        )}
      </div>

      {/* Sebaran: ada di mana aja, buat apa */}
      <Kartu judul="Uangnya ada di mana"
        aksi={<button className="tbl" style={{padding:"7px 11px",minHeight:34}} onClick={()=>setFormAkun({})}>+ Akun</button>}>
        {dataDonat.length>0 && (
          <div style={{display:"flex",flexWrap:"wrap",gap:16,alignItems:"center",justifyContent:"center",marginBottom:14}}>
            <Donat data={dataDonat} tengah={rpk(totalKas)} bawah="total kas"/>
          </div>
        )}
        <div style={{display:"grid",gap:10}}>
          {akun.map(a=>{
            const kartuKredit = a.jenis==="kartu";
            const nilai = kartuKredit ? Math.max(0,-a.saldo) : a.saldo;
            const pct = totalKas>0 && !kartuKredit ? a.saldo/totalKas*100 : 0;
            return (
              <div key={a.id} style={{border:"1px solid var(--garis)",borderRadius:14,padding:"11px 12px"}}>
                <div className="baris" style={{gap:10}}>
                  <div className="ikon" style={{background:a.warna+"22"}}>{a.ikon}</div>
                  <button className="isi" style={{textAlign:"left"}} onClick={()=>setFormAkun(a)}>
                    <div style={{fontSize:13.5,fontWeight:650}}>{a.nama}</div>
                    <div className="samar potong">{a.peruntukan || "Belum diisi buat apa"}</div>
                  </button>
                  <div style={{textAlign:"right"}}>
                    <div className="num" style={{fontWeight:700,fontSize:14,
                      color: kartuKredit ? "var(--merah)" : a.saldo<0 ? "var(--merah)" : "inherit"}}>
                      {kartuKredit && nilai>0 ? "−" : ""}{rp(nilai)}
                    </div>
                    {!kartuKredit && totalKas>0 && <div className="samar">{Math.round(pct)}% dari kas</div>}
                    {kartuKredit && <div className="samar">tagihan</div>}
                  </div>
                </div>
                {!kartuKredit && (
                  <>
                    <div style={{marginTop:8}}><Bar persen={pct} warna={a.warna}/></div>
                    <div className="baris" style={{gap:8,marginTop:8}}>

function FormSesuaikan({akun, tutup, simpan}){
  const [nyata,setNyata] = useState("");
  useEffect(()=>{ if(akun) setNyata(akun.saldo? nf.format(akun.saldo):""); },[akun]);
  if(!akun) return null;
  const beda = angka(nyata) - akun.saldo;
  return (
    <Lembar buka={!!akun} tutup={tutup} judul={"Sesuaikan saldo "+akun.nama}>
      <div className="antara" style={{marginBottom:12}}>
        <span className="sub">Saldo menurut aplikasi</span>
        <span className="num" style={{fontWeight:650}}>{rp(akun.saldo)}</span>
      </div>

        <InputNominal nilai={nyata} set={setNyata} fokus/>

      <div className={"peringatan "+(beda===0?"p-info":"p-waspada")} style={{marginTop:12}}>
        <span>{beda===0?"✅":"⚖️"}</span>
        <div>{beda===0
          ? "Sudah cocok, tidak ada yang perlu disesuaikan."
          : <>Selisih <b>{rp(Math.abs(beda))}</b>. Kalau disimpan, aplikasi membuat satu transaksi penyesuaian {beda>0?"masuk":"keluar"} sebesar itu, supaya saldo cocok dengan kenyataan.</>}</div>

/* ================= PIN ================= */
async function hashPin(pin){
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("myfinance:"+pin));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ return "polos:"+pin; }
}
function LayarKunci({cocokkan}){
  const [pin,setPin] = useState("");
  const [galat,setGalat] = useState("");
  const coba = async v => {
    if(v.length<4) return;
    const ok = await cocokkan(v);
    if(!ok){ setGalat("PIN salah."); setPin(""); }
  };
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{textAlign:"center",maxWidth:300,width:"100%"}}>
        <div style={{fontSize:34}}>🔒</div>
        <h2 style={{marginTop:8}}>My Finance</h2>
        <div className="samar" style={{marginTop:4}}>Masukkan PIN</div>
        <input inputMode="numeric" type="password" autoFocus value={pin} maxLength={6}
          onChange={e=>{ const v=e.target.value.replace(/\D/g,""); setPin(v); setGalat(""); if(v.length>=4) coba(v); }}
          className="num" style={{textAlign:"center",fontSize:24,letterSpacing:"0.3em",marginTop:18}}/>
        {galat && <div className="turun" style={{marginTop:8,fontSize:12.5}}>{galat}</div>}
        <div className="samar" style={{marginTop:16,lineHeight:1.5}}>
          PIN hanya menghalangi orang melihat sekilas. Data di perangkat ini tidak terenkripsi, jadi jangan anggap ini pengaman kuat.
        </div>
      </div>
    </div>
  );
}

  const pulihkan = async e => {
    const f = e.target.files?.[0]; e.target.value="";

          <h3 className="judul" style={{marginBottom:10}}>Mulai ulang</h3>
          {!konfirmHapus
            ? <button className="tbl tbl-penuh" style={{color:"var(--merah)"}} onClick={()=>setKonfirmHapus(true)}>Hapus semua data</button>
            : <div className="peringatan p-bahaya" style={{display:"block"}}>
                <div style={{fontWeight:650}}>Yakin? Semua transaksi, alokasi, tagihan, tujuan, dan aset akan hilang.</div>
                <div style={{marginTop:8}} className="baris">
                  <button className="tbl isi" onClick={aksi.unduhCadangan}>Cadangkan dulu</button>
                  <button className="tbl tbl-bahaya isi" onClick={()=>{aksi.hapusSemua(); tutup();}}>Hapus</button>
                </div>
                <button className="samar" style={{marginTop:8}} onClick={()=>setKonfirmHapus(false)}>Batal</button>
              </div>}
          <button className="tbl tbl-penuh" style={{marginTop:8}} onClick={()=>{aksi.muatContoh(); tutup();}}>Muat ulang data contoh</button>
        </div>

        <div className="samar" style={{textAlign:"center",borderTop:"1px solid var(--garis)",paddingTop:14}}>
          My Finance v2 · berjalan sepenuhnya di perangkat lu · tanpa akun, tanpa server
        </div>
      </div>
    </Lembar>
  );
}

/* ================= APLIKASI ================= */
const TAB = [
  {id:"beranda", nama:"Beranda", ikon:"🏠"},
  {id:"uang",    nama:"Uang",    ikon:"🏦"},
  {id:"rencana", nama:"Rencana", ikon:"🎯"},
  {id:"riwayat", nama:"Riwayat", ikon:"🧾"},
  {id:"laporan", nama:"Laporan", ikon:"📊"},
];

function App(){
  const [db,setDb] = useState(null);
  const [tab,setTab] = useState("beranda");
  const [form,setForm] = useState(null);
  const [setelanBuka,setSetelanBuka] = useState(false);
  const [roti,setRoti] = useState(null);
  const [status,setStatus] = useState("tersimpan");
  const [terkunci,setTerkunci] = useState(false);
  const [adaStorage] = useState(adaPenyimpanan);
  const pertama = useRef(true);
  const urung = useRef(null);

  useEffect(()=>{
    const {data, dariCadangan} = muat();
    if(data){ setDb(data); if(data.setelan.pinHash) setTerkunci(true);
      if(dariCadangan) setTimeout(()=>pesan("Data dipulihkan dari cadangan otomatis"),600); }
    else setDb(kosong());
  },[]);

  useEffect(()=>{
    if(!db) return;
    if(pertama.current){ pertama.current=false; return; }
    const id = setTimeout(()=> setStatus(simpan(db)? "tersimpan" : "gagal tersimpan"), 350);
    return ()=>clearTimeout(id);
  },[db]);

  /* tema */
  useEffect(()=>{
    if(!db) return;
    /* sebagian webview lama tidak punya matchMedia — jangan sampai aplikasi mati karenanya */
    const mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    const pakai = () => {
      const t = db.setelan.tema;
      const gelap = t==="gelap" || (t==="sistem" && !!mq && mq.matches);
      document.documentElement.dataset.tema = gelap? "gelap":"terang";
    };
    pakai();
    mq && mq.addEventListener && mq.addEventListener("change", pakai);
    return ()=> { mq && mq.removeEventListener && mq.removeEventListener("change", pakai); };
  },[db && db.setelan.tema]);

  const pesan = (teks, urungkan) => {
    setRoti({teks, urungkan});
    setTimeout(()=>setRoti(r=> r&&r.teks===teks? null:r), urungkan? 8000 : 2600);
  };
  const ubah = fn => setDb(d=>{ const baru = fn(d); return baru; });
  const simpanUrung = () => { urung.current = db; };

  const aksi = useMemo(()=>({
    roti: pesan,
    bukaForm: tx => setForm(tx),
    simpanTx: tx => {
      ubah(d=>{
        const ada = d.transaksi.some(x=>x.id===tx.id);
        const list = ada ? d.transaksi.map(x=>x.id===tx.id? tx : x) : [tx, ...d.transaksi];
        return {...d, transaksi:list.sort((a,b)=> a.tanggal<b.tanggal?1:-1),
          setelan: tx.jenis==="pindah" ? d.setelan
            : {...d.setelan, metodeTerakhir:{...d.setelan.metodeTerakhir, [tx.jenis]:tx.metode}}};
      });
      pesan(tx.jenis==="masuk"?"Pemasukan tersimpan": tx.jenis==="pindah"?"Pemindahan tersimpan":"Pengeluaran tersimpan");
    },
    hapusTx: id => {
      simpanUrung();
      ubah(d=>({...d, transaksi:d.transaksi.filter(x=>x.id!==id)}));
      pesan("Transaksi dihapus", true);
    },
    catatKilat: p => {
      const tx = {id:uid(), jenis:p.jenis, kategori:p.kategori, nominal:p.nominal, tanggal:hariIni(),
        catatan:p.catatan, metode:p.metode, dibuat:Date.now(), diubah:Date.now()};
      simpanUrung();
      ubah(d=>({...d, transaksi:[tx,...d.transaksi].sort((a,b)=> a.tanggal<b.tanggal?1:-1)}));
      pesan(`${p.catatan||kat(p.kategori).nama} ${rpk(p.nominal)} tercatat`, true);
    },
    simpanPintasan: p => ubah(d=>({...d, pintasan:[...d.pintasan, p]})),
    hapusPintasan: id => ubah(d=>({...d, pintasan:d.pintasan.filter(x=>x.id!==id)})),
    tutupPeringatan: id => ubah(d=>({...d, setelan:{...d.setelan, tutupPeringatan:{...d.setelan.tutupPeringatan, [id]:hariIni()}}})),
    simpanRencana: (mk,r) => { ubah(d=>({...d, rencana:{...d.rencana,[mk]:r}})); pesan("Pembagian disimpan"); },

    simpanAnggaran: a => { ubah(d=>({...d, anggaran: d.anggaran.some(x=>x.id===a.id)? d.anggaran.map(x=>x.id===a.id?a:x) : [...d.anggaran,a]})); pesan("Anggaran disimpan"); },
    hapusAnggaran: id => ubah(d=>({...d, anggaran:d.anggaran.filter(x=>x.id!==id)})),

    simpanTagihan: t => { ubah(d=>({...d, tagihan: d.tagihan.some(x=>x.id===t.id)? d.tagihan.map(x=>x.id===t.id?t:x) : [...d.tagihan,t]})); pesan("Tagihan disimpan"); },
    hapusTagihan: id => ubah(d=>({...d, tagihan:d.tagihan.filter(x=>x.id!==id)})),
    bayarTagihan: t => {
      const mk = bulanIni();
      const hari = Math.min(t.tanggal, new Date().getDate());
      const tanggal = `${mk}-${String(hari).padStart(2,"0")}`;
      const tx = {id:uid(), jenis:"keluar", kategori:t.kategori, nominal:t.nominal, tanggal,
        catatan:t.nama, metode:t.metode, dibuat:Date.now(), diubah:Date.now()};
      simpanUrung();
      ubah(d=>({...d,
        transaksi:[tx,...d.transaksi].sort((a,b)=> a.tanggal<b.tanggal?1:-1),
        tagihan:d.tagihan.map(x=>x.id===t.id? {...x, terakhirBayar:mk} : x)}));
      pesan(`${t.nama} ditandai lunas dan tercatat`, true);
    },

    simpanTujuan: g => { ubah(d=>({...d, tujuan: d.tujuan.some(x=>x.id===g.id)? d.tujuan.map(x=>x.id===g.id?g:x) : [...d.tujuan,g]})); pesan("Tujuan disimpan"); },
    hapusTujuan: id => { simpanUrung(); ubah(d=>({...d, tujuan:d.tujuan.filter(x=>x.id!==id)})); pesan("Tujuan dihapus", true); },
    setorTujuan: (g,nominal,catat) => {
      ubah(d=>{
        const tujuan = d.tujuan.map(x=>x.id===g.id? {...x, terkumpul:x.terkumpul+nominal} : x);
        if(!catat) return {...d, tujuan};
        const tx = {id:uid(), jenis:"keluar", kategori:"tabungan", nominal, tanggal:hariIni(),
          catatan:"Setor "+g.nama, metode:g.akunSimpan||"bank", dibuat:Date.now(), diubah:Date.now()};
        return {...d, tujuan, transaksi:[tx,...d.transaksi].sort((a,b)=> a.tanggal<b.tanggal?1:-1)};
      });
      pesan(`${rpk(nominal)} masuk ke ${g.nama}`);
    },
    tandaiDibeli: g => {
      simpanUrung();
      ubah(d=>({...d, tujuan:d.tujuan.map(x=>x.id===g.id? {...x, status:"dibeli"} : x)}));
      pesan(`${g.nama} ditandai sudah dibeli`, true);
    },

    simpanAset: a => { ubah(d=>({...d, aset: d.aset.some(x=>x.id===a.id)? d.aset.map(x=>x.id===a.id?a:x) : [...d.aset,a]})); pesan("Tersimpan"); },
    hapusAset: id => ubah(d=>({...d, aset:d.aset.filter(x=>x.id!==id)})),

    simpanAkun: a => {
      ubah(d=>({...d, akun: d.akun.some(x=>x.id===a.id)? d.akun.map(x=>x.id===a.id?a:x) : [...d.akun,a]}));
      pesan("Akun disimpan");
    },
    hapusAkun: id => { simpanUrung(); ubah(d=>({...d, akun:d.akun.filter(x=>x.id!==id)})); pesan("Akun dihapus", true); },
    /* Selisih antara saldo aplikasi dan saldo asli dicatat sebagai satu transaksi,
       bukan dengan diam-diam mengubah saldo awal — supaya jejaknya tetap kelihatan. */
    sesuaikanSaldo: (akun, beda) => {
      const tx = {id:uid(), jenis: beda>0?"masuk":"keluar", kategori: beda>0?"lain-masuk":"lainnya",
        nominal: Math.abs(beda), tanggal: hariIni(), catatan:"Penyesuaian saldo "+akun.nama,
        metode: akun.id, dibuat:Date.now(), diubah:Date.now()};
      simpanUrung();
      ubah(d=>({...d, transaksi:[tx,...d.transaksi].sort((a,b)=> a.tanggal<b.tanggal?1:-1)}));
      pesan(`Saldo ${akun.nama} disesuaikan ${rpk(Math.abs(beda))}`, true);
    },

    setProfil: p => ubah(d=>({...d, profil:{...d.profil, ...p}})),
    setSetelan: s => ubah(d=>({...d, setelan:{...d.setelan, ...s}})),
    setPin: async nilai => {
      if(nilai===null){ ubah(d=>({...d, setelan:{...d.setelan, pinHash:null}})); pesan("PIN dimatikan"); return; }
      const h = await hashPin(nilai);
      ubah(d=>({...d, setelan:{...d.setelan, pinHash:h}}));
      pesan("PIN dipasang");
    },
    unduhCadangan: () => {
      const waktu = new Date().toISOString();
      try{
        const isi = JSON.stringify({...db, setelan:{...db.setelan, backupTerakhir:waktu}}, null, 2);
        const b = new Blob([isi],{type:"application/json"}), u = URL.createObjectURL(b);
        const a = document.createElement("a"); a.href=u; a.download=`my-finance-cadangan-${hariIni()}.json`; a.click();
        setTimeout(()=>URL.revokeObjectURL(u),1000);
        ubah(d=>({...d, setelan:{...d.setelan, backupTerakhir:waktu}}));
        pesan("Cadangan terunduh — simpan di Drive lu");
      }catch(e){ pesan("Unduhan diblokir peramban"); }
    },
    pulihkan: isi => {
      simpanUrung();
      const bersih = migrasi(isi);
      const gabung = window.confirm(
        `Cadangan berisi ${bersih.transaksi.length} transaksi.\n\nOK = gabungkan dengan data sekarang (${db.transaksi.length} transaksi)\nBatal = timpa semuanya`);
      if(gabung){
        ubah(d=>{
          const idAda = new Set(d.transaksi.map(t=>t.id));
          const tambah = bersih.transaksi.filter(t=>!idAda.has(t.id));
          return {...d, transaksi:[...d.transaksi,...tambah].sort((a,b)=> a.tanggal<b.tanggal?1:-1)};
        });
        pesan("Data digabungkan", true);
      }else{
        setDb(bersih);
        pesan("Data dipulihkan", true);
      }
    },
    hapusSemua: () => {
      simpanUrung();
      setDb(d=>({...kosong(), profil:d.profil, setelan:{...d.setelan, onboarding:true}, pos:d.pos}));
      pesan("Semua data dihapus", true);
    },
    muatContoh: () => { simpanUrung(); setDb(dataContoh()); pesan("Data contoh dimuat", true); },
  }),[db]);

  if(!db) return <div className="memuat">Memuat My Finance…</div>;
  pasangAkun(db.akun);   /* supaya met() di komponen mana pun memakai akun milik pengguna */

  if(terkunci) return <LayarKunci cocokkan={async v=>{
    const h = await hashPin(v);
    if(h===db.setelan.pinHash){ setTerkunci(false); return true; }
    return false;
  }}/>;

  if(!db.setelan.onboarding) return (
    <Pengenalan
      pakaiContoh={()=>setDb(dataContoh())}
      selesai={(nama,pemasukan,templat)=>{
        const mk = bulanIni(), pos = {};
        POS_BAWAAN.forEach(p=> pos[p.id]=Math.round(pemasukan*(templat.bagi[p.id]||0)/100));
        setDb(d=>({...d, profil:{...d.profil,nama},
          setelan:{...d.setelan, onboarding:true},
          pos: POS_BAWAAN.map(p=>({...p, persen:templat.bagi[p.id]||0})),
          rencana:{...d.rencana,[mk]:{pemasukan,pos}}}));
      }}/>
  );

  const jam = new Date().getHours();
  const sapa = jam<11?"Selamat pagi": jam<15?"Selamat siang": jam<19?"Selamat sore":"Selamat malam";

  return (
    <div className="cangkang">
      <aside className="sisi">
        <div className="baris" style={{gap:9,padding:"0 10px 22px"}}>
          <div className="ikon" style={{background:"var(--hijau)",color:"#fff"}}>💰</div>
          <div>
            <div style={{fontSize:14,fontWeight:700}}>My Finance</div>
            <div className="samar">Keuangan pribadi</div>
          </div>
        </div>
        {TAB.map(t=>(
          <button key={t.id} className={tab===t.id?"aktif":""} onClick={()=>setTab(t.id)}>
            <span>{t.ikon}</span>{t.nama}
          </button>
        ))}
        <button className="tbl tbl-utama tbl-penuh" style={{marginTop:18}} onClick={()=>setForm({})}>+ Catat transaksi</button>
        <div className="samar" style={{padding:"14px 10px 0"}}>Perubahan {status} otomatis.</div>
      </aside>

      <main className="utama">
        <div className="antara" style={{padding:"18px 0 10px"}}>
          <div className="baris" style={{gap:11}}>
            <div className="ikon" style={{width:44,height:44,flex:"0 0 44px",borderRadius:14,background:"var(--hijau)",color:"#fff",fontSize:19}}>
              {db.profil.emoji || (db.profil.nama||"K").charAt(0)}
            </div>
            <div>
              <div style={{fontSize:15,fontWeight:650}}>{sapa}, {db.profil.nama||"Kamu"} 👋</div>
              <div className="samar">{HARI[new Date().getDay()]}, {tglPanjang(hariIni())}</div>
            </div>
          </div>
          <button onClick={()=>setSetelanBuka(true)} aria-label="Pengaturan" style={{fontSize:19,padding:"8px 6px"}}>⚙️</button>
        </div>

        {!adaStorage && (
          <div className="peringatan p-bahaya" style={{marginBottom:12}}>
            <span>🚨</span>
            <div><b>Penyimpanan tidak aktif.</b> Lu kemungkinan membuka ini di mode penyamaran, atau penyimpanan situs diblokir.
            Catatan lu akan hilang begitu tab ditutup. Buka di jendela biasa.</div>
          </div>
        )}

        {tab==="beranda" && <Beranda db={db} aksi={aksi} keTab={setTab} pesan={status}/>}
        {tab==="uang"    && <Uang    db={db} aksi={aksi}/>}
        {tab==="rencana" && <Rencana db={db} aksi={aksi}/>}
        {tab==="riwayat" && <Riwayat db={db} aksi={aksi}/>}
        {tab==="laporan" && <Laporan db={db} aksi={aksi}/>}
      </main>

      <button className="ambang" onClick={()=>setForm({})}>＋ Catat</button>

      <nav className="nav">
        {TAB.map(t=>(
          <button key={t.id} className={tab===t.id?"aktif":""} onClick={()=>setTab(t.id)}>
            <span style={{fontSize:17}}>{t.ikon}</span>{t.nama}
          </button>
        ))}
      </nav>

      <FormTransaksi tx={form} tutup={()=>setForm(null)} simpanTx={aksi.simpanTx} hapusTx={aksi.hapusTx}
        simpanPintasan={aksi.simpanPintasan} metodeTerakhir={db.setelan.metodeTerakhir||{}}/>
      <Pengaturan buka={setelanBuka} tutup={()=>setSetelanBuka(false)} db={db} aksi={aksi}/>

      {roti && (
        <div className="roti">
          <span>{roti.teks}</span>
          {roti.urungkan && urung.current && (
            <button style={{fontWeight:700,color:"#4ade80"}}
              onClick={()=>{ setDb(urung.current); urung.current=null; setRoti(null); }}>Urungkan</button>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("akar")).render(<App/>);

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
