<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<meta name="theme-color" content="#047857">
<title>My Finance</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<style>
/* ============ Sistem desain ============ */
:root{
  --bg:#f2f4f3; --kartu:#ffffff; --tinta:#0c1a16; --redup:#5b6b65; --samar:#8b9a94;
  --garis:#e4eae7; --lembut:#f2f6f4;
  --hijau:#047857; --hijau2:#10b981; --merah:#e11d48; --kuning:#d97706; --biru:#2563eb;
  --r:18px; --r2:12px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html[data-tema="gelap"]{
  --bg:#080d0b; --kartu:#111917; --tinta:#e9f0ed; --redup:#8fa09a; --samar:#6b7d77;
  --garis:#1d2a26; --lembut:#15201c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tinta);font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{background:var(--kartu);border:1px solid var(--garis);border-radius:var(--r2);
  padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--hijau2)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.cangkang{max-width:1100px;margin:0 auto;display:flex}
.utama{flex:1;min-width:0;padding:0 16px 120px}
@media(min-width:900px){ .utama{padding:0 28px 48px} }

.kartu{background:var(--kartu);border:1px solid var(--garis);border-radius:var(--r);padding:16px}
.kartu+.kartu,.blok>*+*{margin-top:14px}
.blok>*{margin-top:14px}
.judul{font-size:14px;font-weight:650}
.sub{color:var(--redup);font-size:12.5px}
.samar{color:var(--samar);font-size:12px}
.baris{display:flex;align-items:center;gap:10px}
.antara{display:flex;align-items:center;justify-content:space-between;gap:10px}
.isi{flex:1;min-width:0}
.potong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.naik{color:var(--hijau)} .turun{color:var(--merah)} .awas{color:var(--kuning)}

.tbl{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 14px;border-radius:var(--r2);border:1px solid var(--garis);font-size:13.5px;font-weight:550}
.tbl:active{transform:scale(.98)}
.tbl-utama{background:var(--hijau);color:#fff;border-color:var(--hijau)}
.tbl-bahaya{background:var(--merah);color:#fff;border-color:var(--merah)}
.tbl-penuh{display:flex;width:100%}
.pil{padding:7px 12px;border-radius:999px;border:1px solid var(--garis);font-size:12.5px;color:var(--redup);
  min-height:36px;display:inline-flex;align-items:center;gap:5px}
.pil.aktif{background:var(--hijau);border-color:var(--hijau);color:#fff;font-weight:550}
.pils{display:flex;flex-wrap:wrap;gap:7px}

.bar{height:8px;border-radius:999px;background:var(--lembut);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .5s}

.label{display:block;font-size:12px;color:var(--redup);margin-bottom:5px;font-weight:550}
.bidang+.bidang{margin-top:12px}

.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--kartu);
  border-top:1px solid var(--garis);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;
  font-size:10.5px;color:var(--samar);min-height:48px}
.nav button.aktif{color:var(--hijau2);font-weight:650}
@media(min-width:900px){ .nav{display:none} }

.sisi{display:none}
@media(min-width:900px){
  .sisi{display:block;width:210px;flex:0 0 210px;padding:24px 14px;position:sticky;top:0;height:100vh;
    border-right:1px solid var(--garis)}
  .sisi button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r2);
    color:var(--redup);font-size:14px;min-height:44px}
  .sisi button.aktif{background:var(--hijau);color:#fff;font-weight:600}
}

.ambang{position:fixed;right:18px;bottom:88px;z-index:41;background:var(--hijau);color:#fff;
  border-radius:999px;padding:14px 20px;font-weight:650;font-size:14px;box-shadow:0 8px 24px rgba(4,120,87,.35);
  display:flex;align-items:center;gap:8px}
@media(min-width:900px){ .ambang{display:none} }

.tirai{position:fixed;inset:0;background:rgba(5,12,10,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){ .tirai{align-items:center} }
.lembar{background:var(--kartu);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  border-radius:22px 22px 0 0;border:1px solid var(--garis)}
@media(min-width:640px){ .lembar{border-radius:22px} }
.lembar-kepala{position:sticky;top:0;background:var(--kartu);border-bottom:1px solid var(--garis);
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;z-index:2}
.lembar-isi{padding:16px}

.roti{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:70;background:#0c1a16;color:#fff;
  border-radius:999px;padding:10px 16px;font-size:13px;display:flex;align-items:center;gap:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.3)}
html[data-tema="gelap"] .roti{background:#e9f0ed;color:#0c1a16}

.peringatan{border-radius:var(--r2);padding:11px 13px;display:flex;gap:10px;align-items:flex-start;font-size:13px;
  border:1px solid transparent}
.p-bahaya{background:rgba(225,29,72,.10);border-color:rgba(225,29,72,.3)}
.p-waspada{background:rgba(217,119,6,.10);border-color:rgba(217,119,6,.3)}
.p-info{background:var(--lembut);border-color:var(--garis)}

.tabel{width:100%;border-collapse:collapse;font-size:13px}
.tabel th{text-align:left;font-weight:550;color:var(--redup);font-size:11.5px;padding:7px 4px;
  border-bottom:1px solid var(--garis)}
.tabel td{padding:8px 4px;border-bottom:1px solid var(--garis)}
.ka{text-align:right}

.puncak{background:linear-gradient(145deg,#047857,#0f766e 55%,#115e59);color:#fff;border-radius:22px;padding:18px}
.puncak .sub,.puncak .samar{color:rgba(224,247,239,.82)}
.kotakputih{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}

.kosong{border:1px dashed var(--garis);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--redup);font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--garis);border-radius:999px;
  padding:7px 11px;font-size:12.5px;min-height:38px}
.ikon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 38px}
.memuat{display:flex;height:100vh;align-items:center;justify-content:center;color:var(--redup);font-size:14px}

@media print{
  .nav,.sisi,.ambang,.tbl,.pil,.roti{display:none !important}
  .utama{padding:0}
  .kartu{break-inside:avoid;border-color:#ccc}
  body{background:#fff}
}
</style>
</head>
<body>
<div id="akar"><div class="memuat">Memuat My Finance…</div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useRef,useCallback} = React;

/* ================= KONSTANTA ================= */
const KUNCI = "myfinance.v2";
const KUNCI_CADANGAN = ["myfinance.v2.cad1","myfinance.v2.cad2","myfinance.v2.cad3"];

const POS_BAWAAN = [
  {id:"kebutuhan", nama:"Kebutuhan",   ikon:"🏠", warna:"#0ea5e9", persen:50},
  {id:"keinginan", nama:"Keinginan",   ikon:"🎈", warna:"#a855f7", persen:20},
  {id:"tabungan",  nama:"Tabungan",    ikon:"🏦", warna:"#10b981", persen:20},
  {id:"darurat",   nama:"Dana Darurat",ikon:"🛟", warna:"#f59e0b", persen:5},
  {id:"sedekah",   nama:"Sedekah",     ikon:"🤲", warna:"#14b8a6", persen:5},
];

const KAT_KELUAR = [
  {id:"makanan",      nama:"Makanan",       ikon:"🍚", warna:"#f97316", pos:"kebutuhan"},
  {id:"transportasi", nama:"Transportasi",  ikon:"🛵", warna:"#3b82f6", pos:"kebutuhan"},
  {id:"tagihan",      nama:"Tagihan",       ikon:"🧾", warna:"#ef4444", pos:"kebutuhan"},
  {id:"rumah",        nama:"Rumah",         ikon:"🏡", warna:"#0891b2", pos:"kebutuhan"},
  {id:"kesehatan",    nama:"Kesehatan",     ikon:"💊", warna:"#ec4899", pos:"kebutuhan"},
  {id:"pendidikan",   nama:"Pendidikan",    ikon:"📚", warna:"#6366f1", pos:"kebutuhan"},
  {id:"belanja",      nama:"Belanja",       ikon:"🛍️", warna:"#a855f7", pos:"keinginan"},
  {id:"hiburan",      nama:"Hiburan",       ikon:"🎬", warna:"#eab308", pos:"keinginan"},
  {id:"langganan",    nama:"Langganan",     ikon:"📺", warna:"#0ea5e9", pos:"keinginan"},
  {id:"lainnya",      nama:"Lainnya",       ikon:"📦", warna:"#94a3b8", pos:"keinginan"},
  {id:"tabungan",     nama:"Tabungan",      ikon:"🏦", warna:"#10b981", pos:"tabungan"},
  {id:"darurat",      nama:"Dana Darurat",  ikon:"🛟", warna:"#f59e0b", pos:"darurat"},
  {id:"sedekah",      nama:"Sedekah",       ikon:"🤲", warna:"#14b8a6", pos:"sedekah"},
];
const KAT_MASUK = [
  {id:"gaji",       nama:"Gaji",      ikon:"💼", warna:"#059669"},
  {id:"usaha",      nama:"Usaha",     ikon:"🏪", warna:"#0d9488"},
  {id:"freelance",  nama:"Freelance", ikon:"🧑‍💻", warna:"#22c55e"},
  {id:"investasi",  nama:"Hasil Investasi", ikon:"📈", warna:"#84cc16"},
  {id:"bonus",      nama:"Bonus",     ikon:"🎁", warna:"#4ade80"},
  {id:"lain-masuk", nama:"Lainnya",   ikon:"📦", warna:"#94a3b8"},
];
const SEMUA_KAT = [...KAT_KELUAR, ...KAT_MASUK];
const kat = id => SEMUA_KAT.find(k=>k.id===id) || {id:"lainnya",nama:"Lainnya",ikon:"📦",warna:"#94a3b8",pos:"keinginan"};
/* pos tempat uang disisihkan, bukan dibelanjakan */
const POS_SIMPAN = ["tabungan","darurat"];

/* Akun = dompet nyata milik pengguna: BCA, BSI, Dana, dompet, kartu kredit.
   Empat id di bawah sengaja sama dengan nama metode bayar versi lama,
   supaya catatan lama tetap terbaca tanpa diutak-atik. */
const AKUN_BAWAAN = [
  {id:"tunai",   nama:"Dompet Tunai", ikon:"💵", warna:"#64748b", jenis:"tunai",
   peruntukan:"Belanja harian & jajan", saldoAwal:0},
  {id:"bank",    nama:"Bank Utama",   ikon:"🏦", warna:"#0ea5e9", jenis:"bank",
   peruntukan:"Gaji masuk, tagihan, tabungan", saldoAwal:0},
  {id:"ewallet", nama:"E-wallet",     ikon:"📱", warna:"#a855f7", jenis:"ewallet",
   peruntukan:"Transport & makan di luar", saldoAwal:0},
  {id:"kartu",   nama:"Kartu Kredit", ikon:"💳", warna:"#f43f5e", jenis:"kartu",
   peruntukan:"Langganan bulanan", saldoAwal:0},
];
const JENIS_AKUN = [
  {id:"tunai",   nama:"Uang tunai"},
  {id:"bank",    nama:"Rekening bank"},
  {id:"ewallet", nama:"E-wallet"},
  {id:"kartu",   nama:"Kartu kredit (hutang)"},
];
const WARNA_AKUN = ["#0ea5e9","#8b5cf6","#f59e0b","#14b8a6","#ec4899","#64748b","#22c55e","#f43f5e"];
const IKON_AKUN = ["🏦","💳","📱","💵","🏧","💼","🐷","⭐"];

/* Daftar akun yang sedang dipakai. Diisi ulang tiap kali data berubah,
   supaya met() bisa dipanggil dari mana saja tanpa mengoper db. */
let DAFTAR_AKUN = AKUN_BAWAAN.slice();
const pasangAkun = list => { if(Array.isArray(list) && list.length) DAFTAR_AKUN = list; };
const met = id => DAFTAR_AKUN.find(m=>m.id===id) || DAFTAR_AKUN[0] || AKUN_BAWAAN[0];
const akunKas = () => DAFTAR_AKUN.filter(a=>a.jenis!=="kartu");

const TIPE_ASET = ["Tunai","Rekening Bank","Saham","Reksa Dana","Crypto","Emas","Properti","Kendaraan","Piutang"];
const TIPE_HUTANG = ["Cicilan","Kartu Kredit","Pinjaman","Hutang Pribadi"];

const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const BLN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];

const TEMPLAT = [
  {nama:"50 / 30 / 20", ket:"Paling umum dan seimbang", bagi:{kebutuhan:50,keinginan:20,tabungan:20,darurat:5,sedekah:5}},
  {nama:"Hemat agresif", ket:"Kejar target cepat", bagi:{kebutuhan:45,keinginan:10,tabungan:30,darurat:10,sedekah:5}},
  {nama:"Kebutuhan berat", ket:"Pemasukan pas-pasan", bagi:{kebutuhan:65,keinginan:15,tabungan:10,darurat:5,sedekah:5}},
];

/* ================= UTILITAS ================= */
const nf = new Intl.NumberFormat("id-ID");
const rp  = n => "Rp " + nf.format(Math.round(n||0));
const rpk = n => {                       // ringkas untuk bagan
  const a = Math.abs(n||0), t = n<0?"-":"";
  if(a>=1e9) return t+"Rp "+(a/1e9).toFixed(1).replace(".",",")+" M";
  if(a>=1e6) return t+"Rp "+(a/1e6).toFixed(1).replace(".",",")+" jt";
  if(a>=1e3) return t+"Rp "+Math.round(a/1e3)+" rb";
  return t+"Rp "+Math.round(a);
};
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const angka = s => { const n = Number(String(s).replace(/[^\d]/g,"")); return Number.isFinite(n)?n:0; };
const ketik = s => { const n = angka(s); return n===0?"":nf.format(n); };

/* tanggal lokal — jangan pakai toISOString, bisa mundur sehari di WIB */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const hariIni = () => iso(new Date());
const kunciBulan = t => t.slice(0,7);
const bulanIni = () => hariIni().slice(0,7);
const jmlHari = mk => new Date(+mk.slice(0,4), +mk.slice(5,7), 0).getDate();
const namaBulan = mk => BULAN[+mk.slice(5,7)-1] + " " + mk.slice(0,4);
const tglPanjang = t => { const [y,m,d]=t.split("-"); return `${+d} ${BULAN[+m-1]} ${y}`; };
const tglPendek  = t => { const [y,m,d]=t.split("-"); return `${+d} ${BLN[+m-1]} ${y}`; };
const geserBulan = (mk,n) => { const d=new Date(+mk.slice(0,4), +mk.slice(5,7)-1+n, 1); return iso(d).slice(0,7); };
const labelHari = t => {
  if(t===hariIni()) return "Hari ini";
  const k=new Date(); k.setDate(k.getDate()-1);
  if(t===iso(k)) return "Kemarin";
  return `${HARI[new Date(t+"T00:00:00").getDay()]}, ${tglPendek(t)}`;
};

/* terbilang singkat, untuk mencegah salah nol */
function terbilang(n){
  if(!n) return "";
  const satuan=["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas"];
  const kecil = x => {
    if(x<12) return satuan[x];
    if(x<20) return satuan[x-10]+" belas";
    if(x<100) return satuan[Math.floor(x/10)]+" puluh"+(x%10?" "+satuan[x%10]:"");
    if(x<200) return "seratus"+(x%100?" "+kecil(x%100):"");
    if(x<1000) return satuan[Math.floor(x/100)]+" ratus"+(x%100?" "+kecil(x%100):"");
    return "";
  };
  let sisa=n, hasil=[];
  const unit=[[1e9,"miliar"],[1e6,"juta"],[1e3,"ribu"]];
  for(const [nilai,nama] of unit){
    const b=Math.floor(sisa/nilai);
    if(b){ hasil.push((nilai===1e3&&b===1?"se":kecil(b)+" ")+nama); sisa-=b*nilai; }
  }
  if(sisa) hasil.push(kecil(sisa));
  return hasil.join(" ").replace(/\s+/g," ").trim()+" rupiah";
}

/* ================= PENYIMPANAN ================= */
function adaPenyimpanan(){
  try{ localStorage.setItem("__tes__","1"); localStorage.removeItem("__tes__"); return true; }
  catch(e){ return false; }
}
function muat(){
  const coba = [KUNCI, ...KUNCI_CADANGAN];
  for(const k of coba){
    try{
      const teks = localStorage.getItem(k);
      if(!teks) continue;
      const d = JSON.parse(teks);
      if(d && Array.isArray(d.transaksi)) return {data:migrasi(d), dariCadangan:k!==KUNCI};
    }catch(e){ /* berkas rusak, coba cadangan berikutnya */ }
  }
  return {data:null, dariCadangan:false};
}
let putaran = 0;
function simpan(data){
  try{
    const teks = JSON.stringify(data);
    localStorage.setItem(KUNCI, teks);
    putaran++;
    if(putaran % 5 === 0) localStorage.setItem(KUNCI_CADANGAN[(putaran/5) % 3 | 0], teks);
    return true;
  }catch(e){ return false; }
}
function ukuranData(){
  try{ return new Blob([localStorage.getItem(KUNCI)||""]).size; }catch(e){ return 0; }
}
/* migrasi: data lama tetap terbaca saat aplikasi berkembang */
function migrasi(d){
  const b = kosong();
  return {
    ...b, ...d,
    v: 3,
    profil:{...b.profil, ...(d.profil||{})},
    setelan:{...b.setelan, ...(d.setelan||{})},
    pos: Array.isArray(d.pos)&&d.pos.length ? d.pos : b.pos,
    /* data v2 belum punya daftar akun — pakai yang bawaan, id-nya sama jadi transaksi lama tetap nyambung */
    akun: Array.isArray(d.akun)&&d.akun.length ? d.akun.map(a=>({...a, saldoAwal:a.saldoAwal||0})) : b.akun,
    rencana: d.rencana||{},
    transaksi:(d.transaksi||[]).map(t=>({...t, jenis:t.jenis||(t.type==="income"?"masuk":"keluar")})),
    anggaran:d.anggaran||[], tagihan:d.tagihan||[], aset:d.aset||[], pintasan:d.pintasan||[],
    /* tujuan v2 cuma punya target; di v3 jadi target barang dengan harga & status */
    tujuan:(d.tujuan||[]).map(g=>({
      status:"nabung", hargaCatatan:"", akunSimpan:"bank", tungguSampai:null, dibuat:Date.now(), ...g
    })),
  };
}
function kosong(){
  return {
    v:3,
    profil:{nama:"", emoji:"🙂"},
    setelan:{tema:"sistem", pengingat:true, backupTerakhir:null, pinHash:null,
             metodeTerakhir:{keluar:"ewallet", masuk:"bank"}, tutupPeringatan:{}, pemisahCsv:";",
             onboarding:false, hariTunggu:7},
    transaksi:[], pos:POS_BAWAAN.map(p=>({...p})), akun:AKUN_BAWAAN.map(a=>({...a})), rencana:{},
    anggaran:[], tagihan:[], tujuan:[], aset:[], pintasan:[],
  };
}

/* ================= DATA CONTOH ================= */
function acakan(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function dataContoh(){
  const d = kosong();
  const r = acakan(20261121);

  if(tgl>=7) tx(new Date(skrg.getFullYear(),skrg.getMonth(),7),"keluar","tabungan",700000,"Setor tabungan","bank");
  /* contoh pindah dana antar rekening sendiri — tidak dihitung masuk maupun keluar */

    {id:uid(), nama:"Spotify",   nominal:54000,   tanggal:28, kategori:"langganan", metode:"kartu", aktif:true, terakhirBayar:geserBulan(mk,-1)},
  ];
  d.tujuan = [
    {id:uid(), nama:"Dana Darurat 6 bulan", ikon:"🛟", target:18000000, terkumpul:5200000,
     tenggat:`${skrg.getFullYear()+1}-12-31`, status:"nabung", hargaCatatan:"6× pengeluaran bulanan",
     akunSimpan:"bank", tungguSampai:null, dibuat:Date.now()-86400000*120},
    {id:uid(), nama:"Laptop kerja", ikon:"💻", target:9500000, terkumpul:3100000,
     tenggat:`${skrg.getFullYear()+1}-06-30`, status:"nabung", hargaCatatan:"Harga pasaran, cek lagi sebelum beli",
     akunSimpan:"bank", tungguSampai:null, dibuat:Date.now()-86400000*60},
    {id:uid(), nama:"Umrah", ikon:"🕋", target:35000000, terkumpul:4000000,
     tenggat:`${skrg.getFullYear()+2}-03-31`, status:"nabung", hargaCatatan:"Paket hemat berdua",
     akunSimpan:"bank", tungguSampai:null, dibuat:Date.now()-86400000*30},

  d.akun = [
    {id:"tunai",   nama:"Dompet",      ikon:"💵", warna:"#64748b", jenis:"tunai",
     peruntukan:"Belanja warung & parkir", saldoAwal:450000},

     peruntukan:"Gaji masuk, bayar tagihan", saldoAwal:3200000},

     peruntukan:"Tabungan & target — jangan diutak-atik", saldoAwal:5200000},
    {id:"ewallet", nama:"Dana",        ikon:"📱", warna:"#8b5cf6", jenis:"ewallet",
     peruntukan:"Makan di luar & ojek online", saldoAwal:300000},
    {id:"kartu",   nama:"Kartu Kredit",ikon:"💳", warna:"#f43f5e", jenis:"kartu",
     peruntukan:"Langganan bulanan saja", saldoAwal:0},
  ];
  d.aset = [
    {id:uid(), jenis:"aset", tipe:"Emas",       nama:"Emas 5 gram",   nominal:7500000},
    {id:uid(), jenis:"aset", tipe:"Saham",      nama:"Portofolio",    nominal:2500000},
    {id:uid(), jenis:"hutang", tipe:"Cicilan",  nama:"Cicilan motor", nominal:4800000},
  ];
  d.pintasan = [
    {id:uid(), jenis:"keluar", kategori:"makanan",      nominal:25000, catatan:"Makan siang", metode:"ewallet"},
    {id:uid(), jenis:"keluar", kategori:"transportasi", nominal:15000, catatan:"Ojek online", metode:"ewallet"},
    {id:uid(), jenis:"keluar", kategori:"makanan",      nominal:18000, catatan:"Kopi",        metode:"tunai"},
  ];
  d.transaksi.sort((a,b)=> a.tanggal<b.tanggal?1:-1);

  /* Saldo awal = saldo pada hari pertama mencatat, bukan hari ini.
     Di data contoh ada riwayat 6 bulan, jadi saldo awalnya dihitung mundur
     dari saldo akhir yang wajar — kalau tidak, akun bisa tampak minus. */
  const akhirDiinginkan = {tunai:450000, bank:2500000, bsi:5700000, ewallet:300000, kartu:-250000};
  const arus = {};
  d.transaksi.forEach(t=>{
    if(t.jenis==="pindah"){
      arus[t.metode] = (arus[t.metode]||0) - t.nominal;
      arus[t.metodeTujuan] = (arus[t.metodeTujuan]||0) + t.nominal;
    }else{
      arus[t.metode] = (arus[t.metode]||0) + (t.jenis==="masuk"? t.nominal : -t.nominal);
    }
  });
  d.akun = d.akun.map(a=>({...a, saldoAwal: (akhirDiinginkan[a.id]||0) - (arus[a.id]||0)}));
  return d;
}

/* ================= HITUNGAN ================= */
/* Pemisahan penting: pengeluaran murni ≠ uang yang disisihkan ke tabungan */
function ringkasBulan(db, mk){
  const list = db.transaksi.filter(t=>kunciBulan(t.tanggal)===mk);
  const masuk  = list.filter(t=>t.jenis==="masuk").reduce((s,t)=>s+t.nominal,0);
  const keluarSemua = list.filter(t=>t.jenis==="keluar").reduce((s,t)=>s+t.nominal,0);
  const disisihkan  = list.filter(t=>t.jenis==="keluar" && POS_SIMPAN.includes(kat(t.kategori).pos))
                          .reduce((s,t)=>s+t.nominal,0);
  const belanja = keluarSemua - disisihkan;
  return {list, masuk, keluarSemua, disisihkan, belanja, sisa:masuk-keluarSemua};
}
/* Saldo tiap akun = saldo awal + semua arus masuk/keluar/pindah yang menyentuhnya.
   Kartu kredit dipisah: itu hutang, bukan uang yang lu punya. */
function saldoPerAkun(db){
  const m = {};
  (db.akun||[]).forEach(a=> m[a.id] = a.saldoAwal||0);
  db.transaksi.forEach(t=>{
    if(t.jenis==="pindah"){
      m[t.metode] = (m[t.metode]||0) - t.nominal;
      m[t.metodeTujuan] = (m[t.metodeTujuan]||0) + t.nominal;
    }else{
      m[t.metode] = (m[t.metode]||0) + (t.jenis==="masuk"? t.nominal : -t.nominal);
    }
  });
  return (db.akun||[]).map(a=>({...a, saldo: m[a.id]||0}));
}
/* Uang yang benar-benar lu pegang: semua akun kecuali kartu kredit */
function saldoTotal(db){
  return saldoPerAkun(db).filter(a=>a.jenis!=="kartu").reduce((s,a)=>s+a.saldo,0);
}
/* Terpakai di kartu kredit — nilai minus berarti ada tagihan berjalan */
function tagihanKartu(db){
  return saldoPerAkun(db).filter(a=>a.jenis==="kartu").reduce((s,a)=>s+Math.max(0,-a.saldo),0);
}
/* Pemakaian tiap akun dalam sebulan */
function pemakaianMetode(db, mk){
  const m = {};
  db.transaksi.filter(t=>kunciBulan(t.tanggal)===mk && t.jenis==="keluar").forEach(t=>{
    m[t.metode] = m[t.metode] || {keluar:0, n:0};
    m[t.metode].keluar += t.nominal; m[t.metode].n++;
  });
  return DAFTAR_AKUN.map(x=>({...x, ...(m[x.id]||{keluar:0,n:0})})).filter(x=>x.keluar>0)
    .sort((a,b)=>b.keluar-a.keluar);
}
function rencanaBulan(db, mk){
  const r = db.rencana[mk];
  if(r) return r;
  const { masuk } = ringkasBulan(db, mk);
  const dasar = masuk || 0;
  const pos = {};
  db.pos.forEach(p=> pos[p.id] = Math.round(dasar*p.persen/100));
  return {pemasukan:dasar, pos};
}
function pakaiPos(db, mk){
  const { list } = ringkasBulan(db, mk);
  const m = {};
  list.filter(t=>t.jenis==="keluar").forEach(t=>{
    const p = kat(t.kategori).pos || "keinginan";
    m[p] = (m[p]||0) + t.nominal;
  });
  return m;
}
function tagihanBulan(db, mk){
  return db.tagihan.filter(t=>t.aktif!==false).map(t=>({...t, lunas: t.terakhirBayar===mk}));
}
function belumBayar(db, mk){
  return tagihanBulan(db,mk).filter(t=>!t.lunas).reduce((s,t)=>s+t.nominal,0);
}

/* perbandingan setara: 1–21 Nov dibanding 1–21 Okt, bukan Oktober penuh */
function belanjaSampaiTgl(db, mk, tanggal){
  return db.transaksi.filter(t=>
    kunciBulan(t.tanggal)===mk && t.jenis==="keluar" &&
    !POS_SIMPAN.includes(kat(t.kategori).pos) && +t.tanggal.slice(8) <= tanggal
  ).reduce((s,t)=>s+t.nominal,0);
}

function peringatan(db){
  const mk = bulanIni(), tgl = new Date().getDate(), total = jmlHari(mk), sisaHari = Math.max(1,total-tgl+1);
  const R = ringkasBulan(db,mk), rencana = rencanaBulan(db,mk), pakai = pakaiPos(db,mk);
  const out = [];
  const tutup = db.setelan.tutupPeringatan||{};

  /* 1. pos jebol atau hampir */
  db.pos.forEach(p=>{
    const jatah = rencana.pos[p.id]||0; if(!jatah) return;
    const kepakai = pakai[p.id]||0, pct = kepakai/jatah*100;
    if(kepakai>jatah) out.push({id:"pos-"+p.id, level:"bahaya", judul:`Pos ${p.nama} sudah lewat batas`,
      pesan:`Terpakai ${rp(kepakai)} dari jatah ${rp(jatah)} — lebih ${rp(kepakai-jatah)}. Tahan dulu sampai ${tglPendek(iso(new Date(new Date().getFullYear(),new Date().getMonth()+1,0)))}.`, tab:"rencana", aksi:"Lihat alokasi"});
    else if(pct>=100) out.push({id:"pos-"+p.id, level:"waspada", judul:`Jatah pos ${p.nama} sudah habis`,
      pesan:`Terpakai pas ${rp(kepakai)}, sesuai rencana. Sisa ${sisaHari} hari jangan dipakai dari pos ini lagi.`, tab:"rencana", aksi:"Lihat alokasi"});
    else if(pct>=80) out.push({id:"pos-"+p.id, level:"waspada", judul:`Pos ${p.nama} tinggal ${rp(jatah-kepakai)}`,
      pesan:`${Math.round(pct)}% jatah sudah dipakai, sisa ${sisaHari} hari lagi.`, tab:"rencana", aksi:"Lihat alokasi"});
  });

  /* 2. laju belanja */
  const jatahBelanja = db.pos.filter(p=>!POS_SIMPAN.includes(p.id)).reduce((s,p)=>s+(rencana.pos[p.id]||0),0);
  if(jatahBelanja>0 && tgl>=5){
    const proyeksi = Math.round(R.belanja/tgl*total);
    if(proyeksi > jatahBelanja*1.05){
      out.push({id:"laju", level:"bahaya", judul:"Laju belanja terlalu cepat",
        pesan:`Rata-rata ${rp(R.belanja/tgl)} per hari. Kalau terus begini, akhir bulan tembus ${rp(proyeksi)} — lebih ${rp(proyeksi-jatahBelanja)} dari jatah. Turunkan ke ${rp(Math.max(0,(jatahBelanja-R.belanja)/sisaHari))} per hari.`,
        tab:"rencana", aksi:"Atur ulang"});
    }
  }

  /* 3. tagihan jatuh tempo */
  tagihanBulan(db,mk).filter(t=>!t.lunas).forEach(t=>{
    const selisih = t.tanggal - tgl;
    if(selisih < 0) out.push({id:"tag-"+t.id, level:"bahaya", judul:`${t.nama} lewat jatuh tempo`,
      pesan:`${rp(t.nominal)}, jatuh tempo tanggal ${t.tanggal}, telat ${-selisih} hari.`, tab:"rencana", aksi:"Tandai lunas"});
    else if(selisih <= 3) out.push({id:"tag-"+t.id, level:"waspada", judul:`${t.nama} jatuh tempo ${selisih===0?"hari ini":`${selisih} hari lagi`}`,
      pesan:`Siapkan ${rp(t.nominal)} lewat ${met(t.metode).nama}.`, tab:"rencana", aksi:"Tandai lunas"});
  });

  /* 4. anggaran kategori */
  db.anggaran.filter(a=>a.bulan===mk).forEach(a=>{
    const kepakai = R.list.filter(t=>t.jenis==="keluar"&&t.kategori===a.kategori).reduce((s,t)=>s+t.nominal,0);
    const pct = kepakai/a.batas*100;
    if(pct>=100) out.push({id:"ang-"+a.id, level:"bahaya", judul:`Anggaran ${kat(a.kategori).nama} jebol`,
      pesan:`${rp(kepakai)} dari batas ${rp(a.batas)}.`, tab:"rencana", aksi:"Lihat anggaran"});
    else if(pct>=80) out.push({id:"ang-"+a.id, level:"waspada", judul:`Anggaran ${kat(a.kategori).nama} ${Math.round(pct)}%`,
      pesan:`Sisa ${rp(a.batas-kepakai)} untuk ${sisaHari} hari.`, tab:"rencana", aksi:"Lihat anggaran"});
  });

  /* 5. saldo menipis — tagihan yang belum dibayar ikut dipotong */
  const saldo = saldoTotal(db), belum = belumBayar(db,mk);
  const tersedia = saldo - belum;
  const lajuHarian = R.belanja/Math.max(1,tgl);
  if(lajuHarian>0){
    const bertahan = Math.floor(tersedia/lajuHarian);
    if(bertahan < 10) out.push({id:"saldo", level: bertahan<4?"bahaya":"waspada", judul:`Saldo cukup untuk sekitar ${Math.max(0,bertahan)} hari`,
      pesan:`Saldo ${rp(saldo)}, tagihan belum dibayar ${rp(belum)}, jadi tersisa ${rp(tersedia)} dengan laju ${rp(lajuHarian)} per hari.`, tab:"laporan", aksi:"Lihat laporan"});
  }

  /* 6. total alokasi tidak masuk akal */
  const totalAlokasi = Object.values(rencana.pos).reduce((s,n)=>s+n,0);
  if(rencana.pemasukan>0 && totalAlokasi > rencana.pemasukan*1.001)
    out.push({id:"alokasi-lebih", level:"bahaya", judul:"Alokasi melebihi pemasukan",
      pesan:`Total pembagian ${rp(totalAlokasi)} padahal pemasukan rencana ${rp(rencana.pemasukan)}. Kurangi ${rp(totalAlokasi-rencana.pemasukan)}.`, tab:"rencana", aksi:"Perbaiki"});

  /* 7. transaksi janggal */
  if(R.masuk>0){
    const besar = R.list.filter(t=>t.jenis==="keluar" && t.nominal > R.masuk*0.25);
    besar.forEach(t=> out.push({id:"besar-"+t.id, level:"info", judul:"Pengeluaran besar bulan ini",
      pesan:`${t.catatan||kat(t.kategori).nama} ${rp(t.nominal)} — ${Math.round(t.nominal/R.masuk*100)}% dari pemasukan bulan ini.`, tab:"riwayat", aksi:"Cek"}));
  }

  /* 8. belum catat hari ini */
  if(db.setelan.pengingat && !db.transaksi.some(t=>t.tanggal===hariIni()))
    out.push({id:"catat", level:"info", judul:"Belum ada catatan hari ini", pesan:"Catat sekarang mumpung masih ingat.", aksi:"Catat", aksiTambah:true});

  /* 9. saldo akun belum diisi — angka "uang ada di mana" jadi tidak berarti */
  if((db.akun||[]).length && db.akun.every(a=>!a.saldoAwal) && db.transaksi.length>=5)
    out.push({id:"saldo-awal", level:"waspada", judul:"Saldo tiap akun belum diisi",
      pesan:"Buka m-banking, isi saldo tiap rekening sekali saja. Tanpa itu, angka di halaman Uang belum menggambarkan keadaan sebenarnya.",
      tab:"uang", aksi:"Isi sekarang"});

  /* 10. target yang tidak masuk akal — lebih baik ketahuan sekarang daripada enam bulan lagi */
  (db.tujuan||[]).filter(g=>g.status!=="dibeli" && g.tenggat && g.terkumpul<g.target).forEach(g=>{
    const hari = Math.ceil((new Date(g.tenggat)-new Date())/864e5);
    if(hari<=0) return;
    const perBulan = (g.target-g.terkumpul)/Math.max(1,hari/30);
    let total=0, n=0;
    for(let i=1;i<=3;i++){
      const r = ringkasBulan(db, geserBulan(mk,-i));
      if(r.list.length===0) continue;
      total += r.masuk - r.belanja; n++;
    }
    const mampu = n? total/n : 0;
    if(mampu>0 && perBulan > mampu*1.2)
      out.push({id:"target-"+g.id, level:"waspada", judul:`Target ${g.nama} belum masuk akal`,
        pesan:`Perlu ${rp(perBulan)} per bulan, sementara sisa uang lu rata-rata ${rp(mampu)}. Mundurkan tenggatnya atau turunkan harganya.`,
        tab:"rencana", aksi:"Atur target"});
  });

  /* 11. belum cadangan */
  const bk = db.setelan.backupTerakhir;
  if(db.transaksi.length>=15 && (!bk || (Date.now()-new Date(bk))/864e5 > 30))
    out.push({id:"backup", level:"waspada", judul:"Sudah lama tidak mencadangkan",
      pesan:"Data hanya ada di perangkat ini. Unduh cadangan dan simpan di Drive.", tab:"laporan", aksi:"Cadangkan"});

  const urut = {bahaya:0, waspada:1, info:2};
  return out.filter(p=> tutup[p.id] !== hariIni()).sort((a,b)=>urut[a.level]-urut[b.level]);
}

/* ================= BAGAN (SVG, tanpa pustaka) ================= */

/* Donat: pembagian menjadi irisan, dengan angka di tengah */
function Donat({data, tengah, bawah, ukuran=160, tebal=22}){
  const total = data.reduce((s,d)=>s+d.nilai,0);
  const R = (ukuran-tebal)/2, K = 2*Math.PI*R;
  let jalan = 0;
  return (
    <svg viewBox={`0 0 ${ukuran} ${ukuran}`} style={{width:ukuran, maxWidth:"100%", height:"auto"}} role="img">
      <circle cx={ukuran/2} cy={ukuran/2} r={R} fill="none" stroke="var(--lembut)" strokeWidth={tebal}/>
      {total>0 && data.map((d,i)=>{
        const panjang = d.nilai/total*K;
        const el = (
          <circle key={i} cx={ukuran/2} cy={ukuran/2} r={R} fill="none" stroke={d.warna} strokeWidth={tebal}
            strokeDasharray={`${Math.max(0,panjang-1.5)} ${K}`} strokeDashoffset={-jalan}
            transform={`rotate(-90 ${ukuran/2} ${ukuran/2})`} strokeLinecap="butt"/>
        );
        jalan += panjang;
        return el;
      })}
      {tengah && <text x="50%" y="47%" textAnchor="middle" fontSize="15" fontWeight="650"
        fill="var(--tinta)" fontFamily="var(--mono)">{tengah}</text>}
      {bawah && <text x="50%" y="61%" textAnchor="middle" fontSize="10" fill="var(--redup)">{bawah}</text>}
    </svg>
  );
}

/* Batang bertumpuk mendatar: "5 juta dibagi ke mana" dalam satu garis */
function BatangTumpuk({data, tinggi=26}){
  const total = data.reduce((s,d)=>s+d.nilai,0) || 1;
  let x = 0;
  return (
    <svg viewBox={`0 0 100 ${tinggi}`} preserveAspectRatio="none" style={{width:"100%",height:tinggi}} role="img">
      {data.map((d,i)=>{
        const w = d.nilai/total*100;
        const el = <rect key={i} x={x} y="0" width={Math.max(0,w-0.4)} height={tinggi} fill={d.warna} rx="1.2"/>;
        x += w; return el;
      })}
    </svg>
  );
}

/* Batang berkelompok: masuk vs keluar per bulan */
function BatangGrup({data, tinggi=170}){
  const maks = Math.max(1, ...data.flatMap(d=>[d.masuk,d.keluar]));
  const L = data.length, lebarSlot = 100/L, lebarBar = Math.min(9, lebarSlot*0.3);
  const pad = 22;
  return (
    <div>
      <svg viewBox={`0 0 100 ${tinggi}`} preserveAspectRatio="none" style={{width:"100%",height:tinggi}} role="img">
        {[0,.25,.5,.75,1].map((g,i)=>(
          <line key={i} x1="0" x2="100" y1={pad+(tinggi-pad*1.4)*(1-g)} y2={pad+(tinggi-pad*1.4)*(1-g)}
            stroke="var(--garis)" strokeWidth="0.6" vectorEffect="non-scaling-stroke"/>
        ))}
        {data.map((d,i)=>{
          const x0 = i*lebarSlot + lebarSlot/2;
          const h = v => (tinggi-pad*1.4)*(v/maks);
          return (
            <g key={i}>
              <rect x={x0-lebarBar-0.6} y={pad+(tinggi-pad*1.4)-h(d.masuk)} width={lebarBar} height={Math.max(0,h(d.masuk))} fill="#10b981" rx="1"/>
              <rect x={x0+0.6} y={pad+(tinggi-pad*1.4)-h(d.keluar)} width={lebarBar} height={Math.max(0,h(d.keluar))} fill="#f43f5e" rx="1"/>
            </g>
          );
        })}
      </svg>
      <div style={{display:"flex",marginTop:4}}>
        {data.map((d,i)=>(
          <div key={i} style={{flex:1,textAlign:"center",fontSize:10.5,color:"var(--redup)"}}>{d.label}</div>
        ))}
      </div>
      <div className="baris" style={{gap:14,marginTop:8,fontSize:11.5,color:"var(--redup)"}}>
        <span className="baris" style={{gap:5}}><i style={{width:9,height:9,borderRadius:3,background:"#10b981",display:"block"}}/>Masuk</span>
        <span className="baris" style={{gap:5}}><i style={{width:9,height:9,borderRadius:3,background:"#f43f5e",display:"block"}}/>Keluar</span>
        <span style={{marginLeft:"auto"}}>Tertinggi {rpk(maks)}</span>
      </div>
    </div>
  );
}

/* Garis area: perjalanan saldo */
function Garis({data, tinggi=140, warna="#10b981"}){
  if(data.length<2) return <div className="kosong">Butuh minimal dua bulan data untuk menggambar grafik ini.</div>;
  const nilai = data.map(d=>d.nilai);
  const maks = Math.max(...nilai), min = Math.min(0, ...nilai), rentang = (maks-min)||1;
  const titik = data.map((d,i)=>[ i/(data.length-1)*100, tinggi-6-((d.nilai-min)/rentang)*(tinggi-20) ]);
  const garis = titik.map(p=>`${p[0]},${p[1]}`).join(" ");
  const area = `0,${tinggi} ` + garis + ` 100,${tinggi}`;
  return (
    <div>
      <svg viewBox={`0 0 100 ${tinggi}`} preserveAspectRatio="none" style={{width:"100%",height:tinggi}} role="img">
        <defs>
          <linearGradient id="gradSaldo" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={warna} stopOpacity="0.30"/>
            <stop offset="100%" stopColor={warna} stopOpacity="0"/>
          </linearGradient>
        </defs>
        <polygon points={area} fill="url(#gradSaldo)"/>
        <polyline points={garis} fill="none" stroke={warna} strokeWidth="2" vectorEffect="non-scaling-stroke"
          strokeLinejoin="round" strokeLinecap="round"/>
      </svg>
      <div className="antara" style={{fontSize:10.5,color:"var(--redup)",marginTop:2}}>
        <span>{data[0].label} · {rpk(data[0].nilai)}</span>
        <span>{data[data.length-1].label} · {rpk(data[data.length-1].nilai)}</span>
      </div>
    </div>
  );
}

/* Garis mungil tanpa sumbu, untuk kartu saldo */
function Mungil({nilai, tinggi=40, warna="#ffffff"}){
  const maks = Math.max(1, ...nilai);
  const titik = nilai.map((v,i)=>`${i/(nilai.length-1)*100},${tinggi-2-(v/maks)*(tinggi-8)}`).join(" ");
  return (
    <svg viewBox={`0 0 100 ${tinggi}`} preserveAspectRatio="none" style={{width:"100%",height:tinggi}} aria-hidden="true">
      <polygon points={`0,${tinggi} ${titik} 100,${tinggi}`} fill={warna} fillOpacity="0.18"/>
      <polyline points={titik} fill="none" stroke={warna} strokeWidth="1.8" vectorEffect="non-scaling-stroke" strokeLinejoin="round"/>
    </svg>
  );
}

/* ================= KOMPONEN UMUM ================= */
function Kartu({judul, aksi, anak, children, pad=16}){
  return (
    <div className="kartu" style={{padding:pad}}>
      {(judul||aksi) && (
        <div className="antara" style={{marginBottom:10}}>
          <h3 className="judul">{judul}</h3>
          {aksi}
        </div>
      )}
      {children||anak}
    </div>
  );
}

function Bar({persen, warna}){
  const w = Math.min(100, Math.max(0, persen||0));
  const c = warna || (persen>=100?"var(--merah)" : persen>=80?"var(--kuning)" : "var(--hijau2)");
  return <div className="bar"><i style={{width:w+"%", background:c}}/></div>;
}

function Lembar({buka, tutup, judul, children}){
  useEffect(()=>{
    if(!buka) return;
    const h = e => e.key==="Escape" && tutup();
    window.addEventListener("keydown",h);
    document.body.style.overflow="hidden";
    return ()=>{ window.removeEventListener("keydown",h); document.body.style.overflow=""; };
  },[buka,tutup]);
  if(!buka) return null;
  return (
    <div className="tirai" onClick={e=>{ if(e.target===e.currentTarget) tutup(); }}>
      <div className="lembar">
        <div className="lembar-kepala">
          <h2 style={{fontSize:15}}>{judul}</h2>
          <button onClick={tutup} aria-label="Tutup" style={{fontSize:20,color:"var(--redup)",padding:"4px 8px"}}>✕</button>
        </div>
        <div className="lembar-isi">{children}</div>
      </div>
    </div>
  );
}

function Bidang({label, petunjuk, children}){
  return (
    <div className="bidang">
      <span className="label">{label}</span>
      {children}
      {petunjuk && <div className="samar" style={{marginTop:4}}>{petunjuk}</div>}
    </div>
  );
}

function Kosong({ikon, teks, aksi}){
  return (
    <div className="kosong">
      <div style={{fontSize:26,marginBottom:6}}>{ikon}</div>
      <div>{teks}</div>
      {aksi && <div style={{marginTop:10}}>{aksi}</div>}
    </div>
  );
}

function BarisTx({t, klik, tampilPos}){
  const k = kat(t.kategori), m = met(t.metode);
  const pindah = t.jenis==="pindah";
  return (
    <button onClick={klik} style={{display:"flex",width:"100%",gap:10,alignItems:"center",padding:"9px 2px",textAlign:"left"}}>
      <div className="ikon" style={{background:pindah?"var(--lembut)":k.warna+"22"}}>{pindah?"🔄":k.ikon}</div>
      <div className="isi">
        <div className="potong" style={{fontSize:14,fontWeight:550}}>
          {pindah ? `Pindah ke ${met(t.metodeTujuan).nama}` : (t.catatan || k.nama)}
        </div>
        <div className="potong samar">
          {pindah ? `${m.nama} → ${met(t.metodeTujuan).nama}` : `${k.nama} · ${m.ikon} ${m.nama}`}
          {tampilPos && !pindah && t.jenis==="keluar" ? ` · pos ${k.pos}` : ""} · {tglPendek(t.tanggal)}
        </div>
      </div>
      <div className="num" style={{fontSize:14,fontWeight:650,
        color: pindah?"var(--redup)" : t.jenis==="masuk"?"var(--hijau)":"var(--merah)"}}>

function PilihKategori({jenis, nilai, set}){

/* ================= BERANDA ================= */
function Beranda({db, aksi, keTab, pesan}){
  const [semuaWarn,setSemuaWarn] = useState(false);
  const mk = bulanIni(), tgl = new Date().getDate(), total = jmlHari(mk), sisaHari = Math.max(1,total-tgl+1);
  const R = ringkasBulan(db,mk), rencana = rencanaBulan(db,mk), pakai = pakaiPos(db,mk);
  const saldo = saldoTotal(db);
  const belum = belumBayar(db,mk);
  const jatahBelanja = db.pos.filter(p=>!POS_SIMPAN.includes(p.id)).reduce((s,p)=>s+(rencana.pos[p.id]||0),0);
  /* aman per hari: jatah belanja dikurangi yang sudah dipakai dan tagihan yang belum dibayar */
  const amanHarian = Math.max(0, (jatahBelanja - R.belanja - belum) / sisaHari);

  const deret = useMemo(()=>{
    const out=[];
    for(let i=13;i>=0;i--){
      const d=new Date(); d.setDate(d.getDate()-i);
      const t=iso(d);
      out.push(db.transaksi.filter(x=>x.tanggal===t&&x.jenis==="keluar"&&!POS_SIMPAN.includes(kat(x.kategori).pos))
        .reduce((s,x)=>s+x.nominal,0));
    }
    return out;
  },[db.transaksi]);

  const lalu = belanjaSampaiTgl(db, geserBulan(mk,-1), tgl);
  const beda = lalu>0 ? Math.round((R.belanja-lalu)/lalu*100) : null;
  const proyeksi = tgl>=3 ? Math.round(R.belanja/tgl*total) : null;
  const warn = peringatan(db);
  const akun = pemakaianMetode(db, mk);
  const totalAkun = akun.reduce((s,a)=>s+a.keluar,0);

  const dataPos = db.pos.map(p=>({label:p.nama, nilai:rencana.pos[p.id]||0, warna:p.warna})).filter(d=>d.nilai>0);

  return (
    <div className="blok">
      {/* Kartu utama — kondisi keuangan dalam 5 detik */}
      <div className="puncak">
        <div className="antara" style={{alignItems:"flex-start"}}>
          <div>
            <div className="samar">Total saldo</div>
            <div className="num" style={{fontSize:30,fontWeight:700,letterSpacing:"-.02em",marginTop:2}}>{rp(saldo)}</div>
          </div>
          <span className="samar" style={{background:"rgba(255,255,255,.15)",padding:"5px 11px",borderRadius:999}}>
            {BULAN[+mk.slice(5,7)-1]}
          </span>
        </div>

        <div style={{margin:"10px -2px 0"}}><Mungil nilai={deret}/></div>
        <div className="samar" style={{marginTop:-2}}>Belanja 14 hari terakhir</div>

        <div className="grid2" style={{marginTop:12,borderTop:"1px solid rgba(255,255,255,.2)",paddingTop:11}}>
          <div>
            <div className="samar">↑ Masuk bulan ini</div>
            <div className="num" style={{fontSize:16,fontWeight:650}}>{rp(R.masuk)}</div>
          </div>
          <div>
            <div className="samar">↓ Belanja bulan ini</div>
            <div className="num" style={{fontSize:16,fontWeight:650}}>{rp(R.belanja)}</div>
          </div>
        </div>

        <div className="kotakputih" style={{marginTop:10}}>
          <div className="antara">
            <div>
              <div className="samar">Aman dipakai per hari · {sisaHari} hari tersisa</div>
              <div className="num" style={{fontSize:19,fontWeight:700}}>{rp(amanHarian)}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div className="samar">Disisihkan</div>
              <div className="num" style={{fontSize:15,fontWeight:650}}>{rpk(R.disisihkan)}</div>
            </div>
          </div>
          {belum>0 && <div className="samar" style={{marginTop:6}}>Sudah dipotong tagihan belum dibayar {rp(belum)}</div>}
        </div>
      </div>

      {/* Peringatan — maksimal 2 yang tampil, sisanya dilipat.
          Kalau semua ditumpuk sekaligus, tidak ada yang kebaca. */}
      {warn.length>0 && (
        <Kartu judul={`Peringatan (${warn.length})`}
          aksi={warn.length>2 && (
            <button className="samar" onClick={()=>setSemuaWarn(!semuaWarn)}>
              {semuaWarn? "Ringkas ▴" : `Lihat semua ▾`}
            </button>)}>
          <div style={{display:"grid",gap:8}}>
            {(semuaWarn? warn : warn.slice(0,2)).map(p=>(
              <div key={p.id} className={"peringatan p-"+p.level}>
                <span style={{fontSize:15,lineHeight:1.2}}>{p.level==="bahaya"?"🚨":p.level==="waspada"?"⚠️":"💡"}</span>
                <div className="isi">
                  <div style={{fontWeight:650,fontSize:13}}>{p.judul}</div>
                  <div style={{color:"var(--redup)",marginTop:2}}>{p.pesan}</div>
                  <div className="baris" style={{marginTop:7,gap:8}}>
                    <button className="tbl" style={{padding:"7px 11px",minHeight:34}}
                      onClick={()=> p.aksiTambah ? aksi.bukaForm({}) : keTab(p.tab||"laporan")}>{p.aksi}</button>
                    <button className="samar" onClick={()=>aksi.tutupPeringatan(p.id)}>Tutup hari ini</button>
                  </div>
                </div>
              </div>
            ))}
            {!semuaWarn && warn.length>2 && (
              <button className="samar" style={{textAlign:"left"}} onClick={()=>setSemuaWarn(true)}>
                +{warn.length-2} peringatan lain
              </button>)}
          </div>
        </Kartu>
      )}

      {/* Catat kilat */}
      <Kartu judul="Catat kilat" aksi={<span className="samar">sekali ketuk</span>}>
        {db.pintasan.length===0
          ? <div className="samar">Belum ada pintasan. Saat menambah transaksi, centang “jadikan pintasan”.</div>
          : <div className="pils">
              {db.pintasan.map(p=>(
                <span key={p.id} className="chip">
                  <button onClick={()=>aksi.catatKilat(p)} className="baris" style={{gap:6}}>
                    <span>{kat(p.kategori).ikon}</span>
                    <span>{p.catatan||kat(p.kategori).nama}</span>
                    <b className="num">{rpk(p.nominal)}</b>
                  </button>
                  <button onClick={()=>aksi.hapusPintasan(p.id)} style={{color:"var(--samar)",paddingLeft:2}}>✕</button>
                </span>
              ))}
            </div>}
      </Kartu>

      {/* Pembagian bulan ini */}
      <Kartu judul={`Pembagian ${rp(rencana.pemasukan)} bulan ini`}
        aksi={<button className="samar" onClick={()=>keTab("alokasi")}>Atur ›</button>}>
        {rencana.pemasukan>0 ? (
          <>
            <BatangTumpuk data={dataPos}/>
            <div style={{display:"grid",gap:9,marginTop:12}}>
              {db.pos.map(p=>{
                const jatah = rencana.pos[p.id]||0; if(!jatah) return null;
                const kepakai = pakai[p.id]||0, pct = jatah? kepakai/jatah*100 : 0;
                return (
                  <div key={p.id}>
                    <div className="antara" style={{fontSize:12.5}}>
                      <span>{p.ikon} {p.nama}</span>
                      <span className="num" style={{color: pct>=100?"var(--merah)":pct>=80?"var(--kuning)":"var(--redup)"}}>
                        {rpk(kepakai)} / {rpk(jatah)}
                      </span>
                    </div>
                    <div style={{marginTop:4}}><Bar persen={pct}/></div>
                    <div className="samar" style={{marginTop:3}}>
                      {kepakai<=jatah ? `Sisa ${rp(jatah-kepakai)}` : `Lewat ${rp(kepakai-jatah)}`} · {Math.round(pct)}%
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        ) : <Kosong ikon="🧭" teks="Belum ada rencana pembagian bulan ini."
              aksi={<button className="tbl tbl-utama" onClick={()=>keTab("alokasi")}>Buat pembagian</button>}/>}
      </Kartu>

      {/* Ringkas sebaris — rinciannya ada di Laporan */}
      {beda!==null && (
        <Kartu pad={13}>
          <div className="antara">
            <span className="sub">Belanja vs bulan lalu (tanggal 1–{tgl})</span>
            <span className={"num "+(beda>=0?"turun":"naik")} style={{fontWeight:650}}>{beda>=0?"+":""}{beda}%</span>
          </div>
          {proyeksi!==null && (
            <div className="samar" style={{marginTop:4}}>Kalau laju ini bertahan, akhir bulan sekitar <b className="num">{rp(proyeksi)}</b>.</div>
          )}
        </Kartu>
      )}

      {/* Transaksi terakhir */}
      <Kartu judul="Transaksi terakhir" aksi={<button className="samar" onClick={()=>keTab("riwayat")}>Semua ›</button>}>
        {db.transaksi.length===0
          ? <Kosong ikon="🧾" teks="Belum ada catatan. Mulai dari pengeluaran hari ini."
              aksi={<button className="tbl tbl-utama" onClick={()=>aksi.bukaForm({})}>Catat transaksi</button>}/>
          : db.transaksi.slice(0,6).map(t=> <BarisTx key={t.id} t={t} klik={()=>aksi.bukaForm(t)}/>)}
      </Kartu>

      <div className="samar" style={{textAlign:"center",paddingBottom:8}}>
        {db.transaksi.length} transaksi tercatat · perubahan {pesan} otomatis
      </div>
    </div>
  );
}

/* ================= FORM TRANSAKSI ================= */
function FormTransaksi({tx, tutup, simpanTx, hapusTx, simpanPintasan, metodeTerakhir}){
  const buka = !!tx;
  const [jenis,setJenis]       = useState("keluar");
  const [nominal,setNominal]   = useState("");
  const [kategori,setKategori] = useState("makanan");
  const [tanggal,setTanggal]   = useState(hariIni());
  const [catatan,setCatatan]   = useState("");
  const [metode,setMetode]     = useState("ewallet");
  const [tujuan,setTujuan]     = useState("bank");
  const [pintas,setPintas]     = useState(false);
  const [galat,setGalat]       = useState("");

  useEffect(()=>{
    if(!tx) return;
    const j = tx.jenis || "keluar";
    setJenis(j);
    setNominal(tx.nominal? nf.format(tx.nominal) : "");
    setKategori(tx.kategori || (j==="masuk"?"gaji":"makanan"));
    setTanggal(tx.tanggal || hariIni());
    setCatatan(tx.catatan || "");
    setMetode(tx.metode || metodeTerakhir[j==="masuk"?"masuk":"keluar"] || "ewallet");
    setTujuan(tx.metodeTujuan || "bank");
    setPintas(false); setGalat("");
  },[tx]);

  const gantiJenis = j => {
    setJenis(j);
    if(j==="masuk" && !KAT_MASUK.some(k=>k.id===kategori)) setKategori("gaji");
    if(j==="keluar" && !KAT_KELUAR.some(k=>k.id===kategori)) setKategori("makanan");
    if(j!=="pindah") setMetode(metodeTerakhir[j]||metode);
  };

  const geserTgl = n => { const d=new Date(); d.setDate(d.getDate()+n); setTanggal(iso(d)); };

  const kirim = () => {
    const n = angka(nominal);
    if(n<=0) return setGalat("Isi nominal lebih dari 0.");
    if(jenis==="pindah" && metode===tujuan) return setGalat("Akun asal dan tujuan tidak boleh sama.");
    const data = {
      id: tx.id || uid(), jenis, nominal:n, tanggal,
      kategori: jenis==="pindah" ? "lainnya" : kategori,
      catatan: catatan.trim(), metode,
      metodeTujuan: jenis==="pindah" ? tujuan : undefined,
      dibuat: tx.dibuat || Date.now(), diubah: Date.now(),
    };
    simpanTx(data);
    if(pintas && jenis!=="pindah") simpanPintasan({id:uid(), jenis, kategori, nominal:n, catatan:catatan.trim(), metode});
    tutup();
  };

  const jenisWarna = {keluar:"var(--merah)", masuk:"var(--hijau)", pindah:"var(--biru)"};

  return (
    <Lembar buka={buka} tutup={tutup} judul={tx&&tx.id ? "Ubah transaksi" : "Catat transaksi"}>
      <div style={{display:"grid",gap:14}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:4,background:"var(--lembut)",padding:4,borderRadius:13}}>
          {[["keluar","Pengeluaran"],["masuk","Pemasukan"],["pindah","Pindah Dana"]].map(([id,l])=>(
            <button key={id} onClick={()=>gantiJenis(id)}

          ))}

        {jenis==="pindah" && (
          <div className="peringatan p-info"><span>🔄</span>
            <div>Pindah dana antar akun sendiri. Tidak dihitung sebagai pemasukan maupun pengeluaran, jadi laporan tetap jujur.</div>

        <InputNominal nilai={nominal} set={setNominal} fokus/>
